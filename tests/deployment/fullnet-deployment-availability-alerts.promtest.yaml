# API 和 Worker 按集群与 Deployment 识别，保留自定义发布名和主动缩容的语义。
rule_files:
  - ../../deploy/observability/prometheus-rules.yaml
evaluation_interval: 1m
tests:
  - name: fullnet-deployment-zero-availability-fires-and-resolves-per-cluster
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="primary",namespace="apps",deployment="custom-api",instance="exporter-a"}'
        values: '1 0 0 0 1 1 1'
      - series: 'kube_deployment_status_replicas_available{cluster="primary",namespace="apps",deployment="custom-api",instance="exporter-b"}'
        values: '1 0 0 0 0 1 1'
      - series: 'kube_deployment_spec_replicas{cluster="primary",namespace="apps",deployment="custom-api",instance="exporter-a"}'
        values: '2+0x6'
      - series: 'kube_deployment_labels{cluster="primary",namespace="apps",deployment="custom-api",label_app_kubernetes_io_part_of="fullnet",label_app_kubernetes_io_component="api"}'
        values: '1+0x6'
      - series: 'kube_deployment_status_replicas_available{cluster="secondary",namespace="apps",deployment="custom-api"}'
        values: '1+0x6'
      - series: 'kube_deployment_spec_replicas{cluster="secondary",namespace="apps",deployment="custom-api"}'
        values: '2+0x6'
      - series: 'kube_deployment_labels{cluster="secondary",namespace="apps",deployment="custom-api",label_app_kubernetes_io_part_of="fullnet",label_app_kubernetes_io_component="api"}'
        values: '1+0x6'
      - series: 'kube_deployment_status_replicas_available{cluster="primary",namespace="apps",deployment="workers"}'
        values: '1 0 0 0 0 0 0'
      - series: 'kube_deployment_spec_replicas{cluster="primary",namespace="apps",deployment="workers"}'
        values: '2 2 2 2 0 0 0'
      - series: 'kube_deployment_labels{cluster="primary",namespace="apps",deployment="workers",label_app_kubernetes_io_part_of="fullnet",label_app_kubernetes_io_component="worker"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 2m
        alertname: FullNetDeploymentNoAvailableReplicas
        exp_alerts: []
      - eval_time: 3m
        alertname: FullNetDeploymentNoAvailableReplicas
        exp_alerts:
          - exp_labels: {cluster: primary, namespace: apps, deployment: custom-api, severity: critical}
            exp_annotations:
              summary: Full.NET deployment has no available replicas
              description: Inspect Deployment events, node readiness and dependency health for this workload.
          - exp_labels: {cluster: primary, namespace: apps, deployment: workers, severity: critical}
            exp_annotations:
              summary: Full.NET deployment has no available replicas
              description: Inspect Deployment events, node readiness and dependency health for this workload.
      - eval_time: 4m
        alertname: FullNetDeploymentNoAvailableReplicas
        exp_alerts: []

  - name: absent-stale-and-unrelated-deployments-do-not-fire
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="apps",deployment="stale-status"}'
        values: '0 _ _ _ _ _'
      - series: 'kube_deployment_spec_replicas{namespace="apps",deployment="stale-status"}'
        values: '2+0x5'
      - series: 'kube_deployment_labels{namespace="apps",deployment="stale-status",label_app_kubernetes_io_part_of="fullnet",label_app_kubernetes_io_component="api"}'
        values: '1+0x5'
      - series: 'kube_deployment_spec_replicas{namespace="apps",deployment="missing-status"}'
        values: '2+0x5'
      - series: 'kube_deployment_labels{namespace="apps",deployment="missing-status",label_app_kubernetes_io_part_of="fullnet",label_app_kubernetes_io_component="worker"}'
        values: '1+0x5'
      - series: 'kube_deployment_status_replicas_available{namespace="apps",deployment="unrelated-api"}'
        values: '0+0x5'
      - series: 'kube_deployment_spec_replicas{namespace="apps",deployment="unrelated-api"}'
        values: '2+0x5'
      - series: 'kube_deployment_labels{namespace="apps",deployment="unrelated-api",label_app_kubernetes_io_part_of="another-app",label_app_kubernetes_io_component="api"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: FullNetDeploymentNoAvailableReplicas
        exp_alerts: []
      - eval_time: 5m
        alertname: FullNetDeploymentNoAvailableReplicas
        exp_alerts: []
