rule_files:
  - ../../deploy/observability/prometheus-rules.yaml
evaluation_interval: 1m
tests:
  - name: capacity-rules-hold-fire-and-resolve-by-instance
    interval: 1m
    input_series:
      - series: 'up{job="fullnet-object-capacity",instance="blocked"}'
        values: '1+0x8'
      - series: 'up{job="fullnet-object-capacity",instance="risk"}'
        values: '1+0x8'
      - series: 'fullnet_object_storage_capacity_sample_timestamp_seconds{job="fullnet-object-capacity",instance="blocked"}'
        values: '0+60x8'
      - series: 'fullnet_object_storage_capacity_sample_timestamp_seconds{job="fullnet-object-capacity",instance="risk"}'
        values: '0+60x8'
      - series: 'fullnet_object_storage_capacity_probe_success{job="fullnet-object-capacity",instance="blocked"}'
        values: '1+0x8'
      - series: 'fullnet_object_storage_capacity_probe_success{job="fullnet-object-capacity",instance="risk"}'
        values: '1+0x8'
      - series: 'fullnet_object_storage_capacity_growth_state{job="fullnet-object-capacity",instance="blocked"}'
        values: '2+0x5 0+0x2'
      - series: 'fullnet_object_storage_capacity_growth_state{job="fullnet-object-capacity",instance="risk"}'
        values: '1+0x5 0+0x2'
      - series: 'fullnet_object_storage_capacity_growth_state{job="node-exporter",instance="unrelated"}'
        values: '2+0x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: FullNetObjectStorageGrowthBlocked
        exp_alerts: []
      - eval_time: 1m
        alertname: FullNetObjectStorageGrowthAtRisk
        exp_alerts: []
      - eval_time: 2m
        alertname: FullNetObjectStorageGrowthBlocked
        exp_alerts:
          - exp_labels: {job: fullnet-object-capacity, instance: blocked, severity: critical}
            exp_annotations:
              summary: Object storage has no free volume slots or has reached its disk reserve
      - eval_time: 2m
        alertname: FullNetObjectStorageGrowthAtRisk
        exp_alerts:
          - exp_labels: {job: fullnet-object-capacity, instance: risk, severity: warning}
            exp_annotations:
              summary: Object storage volume growth headroom is low
      - eval_time: 6m
        alertname: FullNetObjectStorageGrowthBlocked
        exp_alerts: []
      - eval_time: 6m
        alertname: FullNetObjectStorageGrowthAtRisk
        exp_alerts: []
      - eval_time: 6m
        alertname: FullNetObjectStorageCapacityProbeUnavailable
        exp_alerts: []

  - name: stale-growth-is-replaced-by-an-observation-alert
    interval: 1m
    input_series:
      - series: 'up{job="fullnet-object-capacity",instance="stale"}'
        values: '1+0x17'
      - series: 'fullnet_object_storage_capacity_probe_success{job="fullnet-object-capacity",instance="stale"}'
        values: '1+0x17'
      - series: 'fullnet_object_storage_capacity_sample_timestamp_seconds{job="fullnet-object-capacity",instance="stale"}'
        values: '0+0x15 960 1020'
      - series: 'fullnet_object_storage_capacity_growth_state{job="fullnet-object-capacity",instance="stale"}'
        values: '2+0x15 0 0'
    alert_rule_test:
      - eval_time: 12m
        alertname: FullNetObjectStorageGrowthBlocked
        exp_alerts: []
      - eval_time: 14m
        alertname: FullNetObjectStorageCapacityProbeUnavailable
        exp_alerts:
          - exp_labels: {job: fullnet-object-capacity, instance: stale, severity: warning}
            exp_annotations:
              summary: Object storage capacity probe data is unavailable
              description: Check the node exporter, the capacity timer and the object storage master on this host.
      - eval_time: 16m
        alertname: FullNetObjectStorageCapacityProbeUnavailable
        exp_alerts: []

  - name: failed-missing-unreachable-and-future-samples-report-observation-failure
    interval: 1m
    input_series:
      - series: 'up{job="fullnet-object-capacity",instance="failed"}'
        values: '1+0x4'
      - series: 'fullnet_object_storage_capacity_probe_success{job="fullnet-object-capacity",instance="failed"}'
        values: '0+0x4'
      - series: 'up{job="fullnet-object-capacity",instance="missing"}'
        values: '1+0x4'
      - series: 'up{job="fullnet-object-capacity",instance="unreachable"}'
        values: '0+0x4'
      - series: 'up{job="fullnet-object-capacity",instance="future"}'
        values: '1+0x4'
      - series: 'fullnet_object_storage_capacity_probe_success{job="fullnet-object-capacity",instance="future"}'
        values: '1+0x4'
      - series: 'fullnet_object_storage_capacity_sample_timestamp_seconds{job="fullnet-object-capacity",instance="future"}'
        values: '600+60x4'
      - series: 'fullnet_object_storage_capacity_growth_state{job="fullnet-object-capacity",instance="future"}'
        values: '2+0x4'
      - series: 'up{job="node-exporter",instance="unrelated"}'
        values: '1+0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: FullNetObjectStorageGrowthBlocked
        exp_alerts: []
      - eval_time: 2m
        alertname: FullNetObjectStorageCapacityProbeUnavailable
        exp_alerts:
          - exp_labels: {job: fullnet-object-capacity, instance: failed, severity: warning}
            exp_annotations: &unavailable
              summary: Object storage capacity probe data is unavailable
              description: Check the node exporter, the capacity timer and the object storage master on this host.
          - exp_labels: {job: fullnet-object-capacity, instance: missing, severity: warning}
            exp_annotations: *unavailable
          - exp_labels: {job: fullnet-object-capacity, instance: unreachable, severity: warning}
            exp_annotations: *unavailable
          - exp_labels: {job: fullnet-object-capacity, instance: future, severity: warning}
            exp_annotations: *unavailable
