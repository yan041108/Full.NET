input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["fullnet-logs-probe"]
    group_id => "fullnet-log-pq-probe"
    client_id => "fullnet-log-pq-probe"
    consumer_threads => 1
    enable_auto_commit => false
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

output {
  stdout { codec => json_lines }
}
