[SERVICE]
    Flush 1
    Log_Level error
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.path /buffer
    storage.sync normal

[INPUT]
    Name dummy
    Tag fullnet.priority.event
    Dummy {"message":"fullnet-queue-overflow-probe"}
    Rate 10000
    storage.type filesystem

[OUTPUT]
    Name forward
    Alias fullnet_priority_forward
    Match fullnet.priority.*
    Host 127.0.0.1
    Port 24224
    Retry_Limit False
    storage.total_limit_size 64KB
