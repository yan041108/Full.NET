groups:
  - name: fullnet-notifications
    rules:
      - alert: FullNetNotificationBacklogAging
        expr: fullnet_notifications_delivery_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 通知待发送积压超过五分钟，请检查静默、配额与厂商配置

      - alert: FullNetNotificationDeadLetters
        expr: fullnet_notifications_delivery_dead_lettered > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 通知存在死信，请在投递控制面审计处置

      - alert: FullNetNotificationUnknownPending
        expr: fullnet_notifications_delivery_awaiting_reconciliation > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 通知调用结果未知，禁止以人工重试理由代替发送对账

  - name: fullnet-high-concurrency
    rules:
      - alert: FullNetErrorCriticalStorm
        expr: sum by (job, instance) (rate(fullnet_logging_events_offered_total{level=~"Error|Critical"}[5m])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Full.NET Error/Critical log storm

      - alert: FullNetBestEffortLogDrop
        expr: increase(fullnet_logging_events_dropped_total{channel="general"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: B2/Best Effort log queue drops detected

      - alert: FullNetPriorityLogDrop
        expr: increase(fullnet_logging_events_dropped_total{channel="high_priority"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Priority log queue drops detected

      - alert: FullNetLogWorkerUnavailable
        expr: fullnet_logging_worker_state == 4 or fullnet_logging_queue_oldest_age_seconds > 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Host log worker faulted or pending delivery stalled

      - alert: FullNetLogAdmissionBudgetRejected
        expr: increase(fullnet_logging_events_oversize_total[5m]) > 0 or increase(fullnet_logging_events_byte_budget_dropped_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Host log event or byte budget rejected records

      - alert: FullNetLocalLogFileFailure
        expr: increase(fullnet_logging_local_file_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Local log file write or maintenance failed

      - alert: FullNetFluentBitForwardQueueCapacityLow
        expr: fluentbit_output_chunk_available_capacity_percent{name=~"fullnet_priority_forward|fullnet_b2_forward"} < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Fluent Bit Forward logical queue capacity low (not a pre-loss guarantee)

      - alert: FullNetNodeDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes node reports DiskPressure

      - alert: FullNetFluentBitTargetDown
        expr: up{job="fluent-bit"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Fluent Bit metrics target unavailable

      - alert: FullNetFluentBitDaemonSetUnavailable
        expr: kube_daemonset_status_number_unavailable{daemonset="fullnet-fluent-bit"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Fluent Bit DaemonSet has unavailable Pods

      - alert: FullNetFluentBitPriorityOutputDrop
        expr: |
          increase(fluentbit_output_dropped_records_total{name="fullnet_priority_forward"}[5m]) > 0
          or increase(fluentbit_output_retries_failed_total{name="fullnet_priority_forward"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Fluent Bit priority output discarded log records

      - alert: FullNetFluentBitPriorityOutputRetryWithoutProgress
        expr: |
          increase(fluentbit_output_retries_total{name="fullnet_priority_forward"}[5m]) > 0
          and increase(fluentbit_output_proc_records_total{name="fullnet_priority_forward"}[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Fluent Bit priority output retrying without delivery progress

      - alert: FullNetFluentBitBestEffortOutputDrop
        expr: |
          increase(fluentbit_output_dropped_records_total{name=~"fullnet_b2_forward|fullnet_b2_archive"}[5m]) > 0
          or increase(fluentbit_output_retries_failed_total{name=~"fullnet_b2_forward|fullnet_b2_archive"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Fluent Bit best-effort output discarded log records

      - alert: FullNetAuditB1QueuePressure
        expr: fullnet_auditing_microbatch_queue_depth / fullnet_auditing_microbatch_queue_capacity > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Audit B1 micro-batch queue pressure

      - alert: FullNetLogConsumerBacklog
        expr: fullnet_log_consumer_lag_records > 1000 and fullnet_log_consumer_lag_known == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Log consumer committed-offset backlog elevated

      - alert: FullNetLogConsumerLagUnknown
        expr: fullnet_log_consumer_lag_known == 0 and fullnet_log_consumer_assigned_partitions > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Log consumer lag sample unavailable or stale

      - alert: FullNetLogConsumerDeliveryFailure
        expr: increase(fullnet_log_consumer_delivery_results_total{outcome=~"retry|error"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Log consumer downstream confirmation or offset failed

      - alert: FullNetLogConsumerTargetDown
        expr: up{job="fullnet-log-consumer"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Log consumer metrics target unavailable

      - alert: FullNetLogConsumerRestarting
        expr: |
          increase(kube_pod_container_status_restarts_total{container="consumer"}[5m]) > 2
          and on (namespace, pod) kube_pod_labels{label_app_kubernetes_io_name="fullnet-log-consumer"} == 1
        labels:
          severity: critical
        annotations:
          summary: Log consumer repeated restart may hide short-lived failures

      - alert: FullNetAuditB1WaitOrFailure
        expr: |
          increase(fullnet_auditing_microbatch_failed_total[5m]) > 0
          or increase(fullnet_auditing_microbatch_rejected_total[5m]) > 0
          or histogram_quantile(0.99, sum by (le, job, instance) (rate(fullnet_auditing_microbatch_wait_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Audit B1 wait/failure regression

      - alert: FullNetCacheInvalidationStaleWindow
        expr: histogram_quantile(0.99, sum(rate(fullnet_cache_invalidation_duration_milliseconds_bucket[5m])) by (le)) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Cache invalidation P99 exceeds the publisher latency budget
          description: This measures local/shared deletion and publication latency, not remote-node acknowledgement or business data freshness.

      - alert: FullNetCacheInvalidationFailures
        expr: sum(increase(fullnet_cache_invalidation_failures_total[5m])) by (scope) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cache invalidation failures observed
          description: Check the originating operation and Redis/Backplane readiness. Committed writes remain committed; C0 decisions must use authority.

      - alert: FullNetCacheBackplaneCircuitOpens
        expr: sum(increase(fullnet_cache_backplane_circuit_transitions_total{state="open"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cache Backplane circuit opened recently
          description: This is an observed transition, not the current circuit state. Confirm subscription/publication recovery and missed-message TTL convergence.

      - alert: FullNetCacheDistributedCircuitOpens
        expr: sum(increase(fullnet_cache_runtime_events_total{layer="l2",operation="circuit",result="open"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cache L2 circuit opened recently
          description: Confirm Redis readiness and DB refill pressure; a later close event alone does not prove authority or cross-node convergence.

      - alert: FullNetCacheFactoryFailures
        expr: sum(increase(fullnet_cache_runtime_events_total{layer="factory",result=~"failure|timeout"}[5m])) by (operation) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cache foreground or background factory failures observed
          description: Check the source dependency. S2 Fail-Safe activation is permitted degradation and is not itself a permission-staleness incident.

      - alert: FullNetCacheBatchRejected
        expr: sum(increase(fullnet_cache_invalidation_batch_rejections_total{reason=~"capacity|invalid_input|timeout"}[5m])) by (reason) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cache invalidation batch rejected by its resource budget
          description: Check owned target size and batch pressure. Prefer registered resource tags for bulk operations; do not clear the Redis database.

      - alert: FullNetRedisReconnectOrEviction
        expr: |
          increase(redis_connected_clients[5m]) < 0
          or increase(redis_evicted_keys_total[5m]) > 100
          or redis_replication_lag_seconds > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis reconnect/eviction/replication lag

      - alert: FullNetDatabaseConnectionWait
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(fullnet_db_connection_wait_seconds_bucket[5m])) by (le, provider, host_role)
          ) > 0.2
          and on (provider, host_role)
          sum(rate(fullnet_db_connection_acquire_total[5m])) by (provider, host_role) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Database connection pool wait elevated

      - alert: FullNetDatabaseConnectionAcquireTimeout
        expr: sum(increase(fullnet_db_connection_acquire_total{outcome="timeout"}[5m])) by (provider, host_role) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Database connection acquisition timed out

      - alert: FullNetDatabaseConnectionAdmissionRejected
        expr: sum(increase(fullnet_db_connection_acquire_total{outcome="rejected"}[5m])) by (provider, host_role) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Database admission queue rejected requests

      - alert: FullNetOutboxJobsBacklogAge
        expr: max(fullnet_outbox_backlog_oldest_age_seconds) > 300 or max(fullnet_jobs_backlog_oldest_age_seconds) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Outbox/Jobs backlog age exceeds 5 minutes

      - alert: FullNetMessagingKafkaConsumeFailures
        expr: sum(increase(fullnet_messaging_kafka_consume_results_total{result!="success"}[5m])) by (topic_code, consumer_code, result, reason_code) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kafka messaging consume failures detected (low-cardinality labels only)

      - alert: FullNetMessagingSqlServerCdcCaptureJobStopped
        expr: min(fullnet_messaging_cdc_sqlserver_capture_job_running) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SQL Server CDC capture job appears stopped (fill via UpdateCdcPlatformHealth)

      - alert: FullNetMessagingMySqlBinlogRetentionLow
        expr: min(fullnet_messaging_cdc_mysql_binlog_retention_hours) < 24
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: MySQL binlog retention below 24h fail-closed threshold

      - alert: FullNetMessagingConnectorOffsetUnrecoverable
        expr: max(fullnet_messaging_connector_offset_unrecoverable) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Debezium/Kafka Connect offset reported unrecoverable

      - alert: FullNetMessagingKafkaLagNearRetention
        expr: max(fullnet_messaging_kafka_lag_retention_ratio) > 0.8
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Kafka consumer lag approaching topic retention window

      - alert: FullNetEdgeGlobalRateRejected
        expr: increase(edge_rate_limit_rejected_total{scope="global"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Edge global rate/connection budget rejections

      - alert: FullNetWafOrExternalLimiterDown
        expr: up{job=~"waf|ddos|distributed-rate-limit"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WAF/DDoS or external rate-limit service unavailable

      - alert: FullNetHpaAtMaxReplicas
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~".*fullnet-(api|worker).*"}
          >=
          kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~".*fullnet-(api|worker).*"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Full.NET HPA sitting at maxReplicas

      - alert: FullNetPdbUnsatisfied
        expr: kube_poddisruptionbudget_status_pod_disruptions_allowed{poddisruptionbudget=~".*fullnet.*"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Full.NET PDB currently unsatisfied / no disruptions allowed
