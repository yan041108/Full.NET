# Fluent Bit Collector candidate for Full.NET (platform-managed DaemonSet).
# Pod ingress metadata is mandatory; this configuration still requires fixed-version behavior tests.
# Application emits Compact JSON stdout only; this is not a Durable Audit pipeline.

fullnameOverride: fullnet-fluent-bit

config:
  service: |
    [SERVICE]
        Flush         1
        Daemon        Off
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        storage.path  /var/fluent-bit/buffer
        storage.sync  normal
        storage.checksum off
        storage.backlog.mem_limit 64MB
        storage.max_chunks_up 128
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*fullnet*.log
        Multiline.Parser  docker, cri
        DB                /var/fluent-bit/tail.db
        Mem_Buf_Limit     48MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        storage.type      filesystem

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Labels              On
        Annotations         Off
        Merge_Log           Off

    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        Rule                $kubernetes['labels']['fullnet.io/log-ingress'] ^collector$ fullnet.raw false
        Emitter_Name        fullnet_ingress
        Emitter_Storage.type filesystem
        Emitter_Mem_Buf_Limit 32MB

    [FILTER]
        Name                parser
        Match               fullnet.raw
        Key_Name            log
        Parser              fullnet_compact_json
        Reserve_Data        On
        Preserve_Key        Off

    [FILTER]
        Name                modify
        Match               fullnet.raw
        Copy                @t _fullnet_required_timestamp
        Copy                @mt _fullnet_required_message
        Copy                log.class _fullnet_required_class

    [FILTER]
        Name                grep
        Match               fullnet.raw
        Logical_Op          AND
        Regex               _fullnet_required_timestamp ^.+$
        Regex               _fullnet_required_message ^.+$
        Regex               LogEventId ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        Regex               Instance ^.+$
        Regex               _fullnet_required_class ^.+$

    [FILTER]
        Name                modify
        Match               fullnet.raw
        Remove              _fullnet_route_reliability
        Remove              _fullnet_route_level
        Copy                reliability.class _fullnet_route_reliability
        Copy                @l _fullnet_route_level
        Add                 _fullnet_route_reliability BestEffort

    [FILTER]
        Name                rewrite_tag
        Match               fullnet.raw
        Rule                $_fullnet_route_reliability ^Priority$ fullnet.priority.event false
        Rule                $_fullnet_route_level ^(Error|Fatal)$ fullnet.priority.event false
        Rule                $_fullnet_route_reliability ^BestEffort$ fullnet.b2.event false
        Emitter_Name        fullnet_classification
        Emitter_Storage.type filesystem
        Emitter_Mem_Buf_Limit 32MB

    [FILTER]
        Name                modify
        Match               fullnet.priority.*
        Remove              _fullnet_route_reliability
        Remove              _fullnet_route_level
        Remove              _fullnet_required_timestamp
        Remove              _fullnet_required_message
        Remove              _fullnet_required_class
        Remove              kubernetes
        Remove              tenant_id
        Remove              user_id
        Remove              DiagnosticGroup

    [FILTER]
        Name                modify
        Match               fullnet.b2.*
        Remove              _fullnet_route_reliability
        Remove              _fullnet_route_level
        Remove              _fullnet_required_timestamp
        Remove              _fullnet_required_message
        Remove              _fullnet_required_class
        Remove              kubernetes
        Remove              tenant_id
        Remove              user_id
        Remove              DiagnosticGroup

  outputs: |
    [OUTPUT]
        Name                forward
        Alias               fullnet_priority_forward
        Match               fullnet.priority.*
        Host                loki-priority.observability.svc
        Port                24224
        Require_ack_response On
        net.io_timeout      5s
        Retry_Limit         False
        storage.total_limit_size 256MB
        tls                 On
        tls.verify          On
        tls.verify_hostname On
        tls.ca_file         /fluent-bit/tls/ca.crt

    [OUTPUT]
        Name                forward
        Alias               fullnet_b2_forward
        Match               fullnet.b2.*
        Host                loki-besteffort.observability.svc
        Port                24224
        Require_ack_response On
        net.io_timeout      5s
        Retry_Limit         3
        storage.total_limit_size 512MB
        tls                 On
        tls.verify          On
        tls.verify_hostname On
        tls.ca_file         /fluent-bit/tls/ca.crt

    [OUTPUT]
        Name                s3
        Alias               fullnet_b2_archive
        Match               fullnet.b2.*
        bucket              fullnet-log-archive
        region              us-east-1
        total_file_size     32M
        upload_timeout      5m
        store_dir           /var/fluent-bit/s3-buffer
        retry_limit         5
        compression         gzip

  customParsers: |
    [PARSER]
        Name        fullnet_compact_json
        Format      json
        Time_Key    @t
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

extraVolumes:
  # 平台须预置仅含接收端信任根的 Secret；轮换后滚动重启采集器以重新建立 TLS 连接。
  - name: forward-ca
    secret:
      secretName: fullnet-forward-ca
      items:
        - key: ca.crt
          path: ca.crt
  - name: fluent-bit-buffer
    emptyDir:
      sizeLimit: 2Gi

extraVolumeMounts:
  - name: forward-ca
    mountPath: /fluent-bit/tls
    readOnly: true
  - name: fluent-bit-buffer
    mountPath: /var/fluent-bit

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

fullnetContract:
  applicationStdoutFormat: compact-json
  durableAuditViaFluentBit: false
  recursiveSinkWriteback: false
  diskBuffer: true
  memoryLimit: true
  corruptChunkIsolation: false
  retryLimit: true
  tls: true
  requiredLogFields:
    - "@t"
    - "@mt"
    - LogEventId
    - Instance
    - log.class
  optionalLogFields:
    - "@l"
    - Application
    - TraceId
    - SpanId
    - log.stream
    - reliability.class
    - data.classification
    - EventName
