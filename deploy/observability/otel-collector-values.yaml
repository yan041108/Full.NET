# Full.NET 的 OpenTelemetry Collector values；升级镜像时须重跑真实配置与指标链路验收。
mode: deployment
replicaCount: 2

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: "0.163.1"
  digest: sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
command:
  name: otelcol-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
      spike_limit_mib: 128
    batch:
      send_batch_size: 1024
      timeout: 5s
    attributes/drop_high_cardinality:
      actions:
        - key: DiagnosticGroup
          action: delete
        - key: tenant_id
          action: delete
        - key: user_id
          action: delete

  extensions:
    file_storage:
      directory: /var/otel-collector/storage
      timeout: 10s
      compaction:
        on_start: true
        directory: /var/otel-collector/storage
        max_transaction_size: 65536
    health_check:
      endpoint: 0.0.0.0:13133

  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc:4317
      tls:
        insecure: false
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
      sending_queue:
        enabled: true
        storage: file_storage
        num_consumers: 4
        queue_size: 2048
    prometheus_remote_write:
      http:
        endpoint: http://prometheus.observability.svc:9090/api/v1/write
        tls:
          insecure: false
      # 显式保持现行指标命名和单请求发送，避免版本默认值变化导致告警失配或同序列乱序。
      translation_strategy: UnderscoreEscapingWithSuffixes
      max_batch_request_parallelism: 1
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
      # 此导出器有独立队列和 WAL，不支持 OTLP exporter 的 sending_queue.storage。
      # 单消费者保持同序列发送顺序；WAL 使用下方 emptyDir，只覆盖 Pod 生命周期内的重启。
      remote_write_queue:
        enabled: true
        num_consumers: 1
        queue_size: 1024
      wal:
        directory: /var/otel-collector/storage/prometheus
        buffer_size: 100
        truncate_frequency: 1m

  service:
    extensions: [file_storage, health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, attributes/drop_high_cardinality]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch, attributes/drop_high_cardinality]
        exporters: [prometheus_remote_write]
    telemetry:
      logs:
        level: info

extraVolumes:
  - name: otel-storage
    emptyDir:
      sizeLimit: 2Gi

extraVolumeMounts:
  - name: otel-storage
    mountPath: /var/otel-collector/storage

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

fullnetContract:
  memoryLimiter: true
  batch: true
  retry: true
  fileStorage: true
  recursiveSinkWriteback: false
  durableAuditDuplication: false
