{{- include "fullnet.validate" . -}}
{{- if .Values.roles.api }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullnet.fullname" . }}-api
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fullnet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
