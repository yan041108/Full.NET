{{- include "fullnet.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fullnet.fullname" . }}-config
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
data:
  Database__Provider: {{ .Values.database.provider | quote }}
  ASPNETCORE_URLS: "http://+:8080"
  Realtime__TransportMode: {{ .Values.realtime.transportMode | quote }}
  Realtime__SkipNegotiation: {{ .Values.realtime.skipNegotiation | quote }}
  Realtime__RequireSessionAffinity: {{ .Values.realtime.requireSessionAffinity | quote }}
  DataProtection__ApplicationName: {{ .Values.dataProtection.applicationName | quote }}
  Jobs__Worker__MaxConcurrency: {{ .Values.worker.maxConcurrency | quote }}
  OutboxWorker__MaxConcurrency: {{ .Values.worker.maxConcurrency | quote }}
  RateLimiting__GlobalApiPermitLimitPerMinute: {{ .Values.applicationRateLimiting.globalApiPermitLimitPerMinutePerReplica | quote }}
  FULLNET_CAPACITY_STATUS: "Capacity-not-verified"
{{- if eq (include "fullnet.codeGenerationApplyEnabled" .) "true" }}
  CodeGeneration__Apply__Enabled: "true"
  CodeGeneration__Apply__WorkspaceRoot: {{ .Values.codeGeneration.apply.workspaceRoot | quote }}
  CodeGeneration__Apply__DistributedGateEnabled: {{ .Values.codeGeneration.apply.distributedGateEnabled | quote }}
  CodeGeneration__Apply__MaxRollbackChainLength: {{ .Values.codeGeneration.apply.maxRollbackChainLength | quote }}
  CodeGeneration__CheckpointRetention__Enabled: {{ .Values.codeGeneration.checkpointRetention.enabled | quote }}
  CodeGeneration__CheckpointRetention__RetentionDays: {{ .Values.codeGeneration.checkpointRetention.retentionDays | quote }}
  CodeGeneration__CheckpointRetention__PollSeconds: {{ .Values.codeGeneration.checkpointRetention.pollSeconds | quote }}
  CodeGeneration__CheckpointRetention__MaxDeletesPerRun: {{ .Values.codeGeneration.checkpointRetention.maxDeletesPerRun | quote }}
  CodeGeneration__CheckpointRetention__MaxCheckpointCount: {{ .Values.codeGeneration.checkpointRetention.maxCheckpointCount | quote }}
{{- end }}
{{- if .Values.roles.worker }}
  Realtime__Enabled: "true"
{{- end }}
