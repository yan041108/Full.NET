{{- include "fullnet.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fullnet.fullname" . }}-config
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
data:
  DOTNET_ENVIRONMENT: {{ .Values.dotnetEnvironment | quote }}
  ASPNETCORE_ENVIRONMENT: {{ .Values.dotnetEnvironment | quote }}
  Database__Provider: {{ .Values.database.provider | quote }}
  # 轮转至少等待生产基线的 API 最小副本数就绪，不以单节点成功代表整个集群。
  Identity__Oidc__MinimumReadyApiNodes: {{ ternary .Values.api.hpa.minReplicas .Values.api.replicaCount .Values.api.hpa.enabled | quote }}
{{- if .Values.roles.api }}
  DatabaseCapacity__Enabled: "true"
  DatabaseCapacity__HostRole: "Api"
  DatabaseCapacity__PermitLimit: {{ .Values.databaseConnectionBudget.apiPermitLimit | quote }}
  DatabaseCapacity__QueueLimit: {{ .Values.databaseConnectionBudget.apiQueueLimit | quote }}
  DatabaseCapacity__AcquireTimeoutMilliseconds: {{ .Values.databaseConnectionBudget.apiAcquireTimeoutMilliseconds | quote }}
  DatabaseCapacity__ExpectedMaxPoolSize: {{ .Values.databaseConnectionBudget.apiMaxPoolSize | quote }}
  DatabaseCapacity__CriticalWorkerReserve: "0"
  DatabaseCapacity__AuthorizationReadReserve: {{ .Values.databaseConnectionBudget.apiAuthorizationReadReserve | quote }}
{{- else if .Values.roles.worker }}
  DatabaseCapacity__Enabled: "true"
  DatabaseCapacity__HostRole: "Worker"
  DatabaseCapacity__PermitLimit: {{ .Values.databaseConnectionBudget.workerPermitLimit | quote }}
  DatabaseCapacity__QueueLimit: {{ .Values.databaseConnectionBudget.workerQueueLimit | quote }}
  DatabaseCapacity__AcquireTimeoutMilliseconds: {{ .Values.databaseConnectionBudget.workerAcquireTimeoutMilliseconds | quote }}
  DatabaseCapacity__ExpectedMaxPoolSize: {{ .Values.databaseConnectionBudget.workerMaxPoolSize | quote }}
  DatabaseCapacity__CriticalWorkerReserve: {{ .Values.databaseConnectionBudget.workerCriticalReserve | quote }}
  DatabaseCapacity__AuthorizationReadReserve: "0"
{{- else }}
  DatabaseCapacity__Enabled: "false"
  DatabaseCapacity__HostRole: "Migrator"
  DatabaseCapacity__PermitLimit: "1"
  DatabaseCapacity__AuthorizationReadReserve: "0"
  DatabaseCapacity__QueueLimit: "0"
  DatabaseCapacity__AcquireTimeoutMilliseconds: "1000"
  DatabaseCapacity__ExpectedMaxPoolSize: {{ .Values.databaseConnectionBudget.migrationReserve | quote }}
  DatabaseCapacity__CriticalWorkerReserve: "0"
{{- end }}
  DatabaseCapacity__HealthReserve: {{ .Values.databaseConnectionBudget.healthReserve | quote }}
  DatabaseCapacity__ApiMaxReplicas: {{ .Values.api.hpa.maxReplicas | quote }}
  DatabaseCapacity__ApiMaxPoolSize: {{ .Values.databaseConnectionBudget.apiMaxPoolSize | quote }}
  DatabaseCapacity__WorkerMaxReplicas: {{ .Values.worker.hpa.maxReplicas | quote }}
  DatabaseCapacity__WorkerMaxPoolSize: {{ .Values.databaseConnectionBudget.workerMaxPoolSize | quote }}
  DatabaseCapacity__MigrationReserve: {{ .Values.databaseConnectionBudget.migrationReserve | quote }}
  DatabaseCapacity__TotalBudget: {{ .Values.databaseConnectionBudget.total | quote }}
  ASPNETCORE_URLS: "http://+:8080"
  Realtime__TransportMode: {{ .Values.realtime.transportMode | quote }}
  Realtime__SkipNegotiation: {{ .Values.realtime.skipNegotiation | quote }}
  Realtime__RequireSessionAffinity: {{ .Values.realtime.requireSessionAffinity | quote }}
  DataProtection__ApplicationName: {{ .Values.dataProtection.applicationName | quote }}
  Jobs__Worker__MaxConcurrency: {{ .Values.worker.maxConcurrency | quote }}
  OutboxWorker__MaxConcurrency: {{ .Values.worker.maxConcurrency | quote }}
  OutboxWorker__DatabaseCapacityBackoffMilliseconds: {{ .Values.worker.databaseCapacityBackoffMilliseconds | quote }}
  Messaging__Worker__Mode: {{ .Values.worker.messaging.mode | quote }}
  Messaging__CdcMonitoring__Enabled: {{ .Values.worker.messaging.cdcMonitoring.enabled | quote }}
  Messaging__CdcMonitoring__PollSeconds: {{ .Values.worker.messaging.cdcMonitoring.pollSeconds | quote }}
  Messaging__CdcMonitoring__SampleTimeoutSeconds: {{ .Values.worker.messaging.cdcMonitoring.sampleTimeoutSeconds | quote }}
  Messaging__CdcMonitoring__MaximumSampleAgeSeconds: {{ .Values.worker.messaging.cdcMonitoring.maximumSampleAgeSeconds | quote }}
  Messaging__CdcMonitoring__RetentionTimeTopicId: {{ .Values.worker.messaging.cdcMonitoring.retentionTimeTopicId | quote }}
{{- range $topic, $id := .Values.worker.messaging.cdcMonitoring.retentionTimeTopics }}
  Messaging__CdcMonitoring__RetentionTimeTopics__{{ $topic }}: {{ $id | quote }}
{{- end }}
  Messaging__CdcMonitoring__MaximumBrokerClockSkewSeconds: {{ .Values.worker.messaging.cdcMonitoring.maximumBrokerClockSkewSeconds | quote }}
{{- if eq .Values.worker.messaging.mode "ShadowCdc" }}
  Messaging__ShadowComparison__Enabled: "true"
{{- else }}
  Messaging__ShadowComparison__Enabled: "false"
{{- end }}
{{- if ne .Values.worker.messaging.mode "HybridKafka" }}
  Messaging__Kafka__Enabled: "false"
{{- end }}
  RateLimiting__GlobalApiPermitLimitPerMinute: {{ .Values.applicationRateLimiting.globalApiPermitLimitPerMinutePerReplica | quote }}
  FULLNET_CAPACITY_STATUS: "Capacity-not-verified"
{{- if .Values.codeGeneration.artifacts.enabled }}
  CodeGeneration__Artifacts__RootDirectory: {{ .Values.codeGeneration.artifacts.rootDirectory | quote }}
  CodeGeneration__Artifacts__RetentionDays: {{ .Values.codeGeneration.artifacts.retentionDays | quote }}
  CodeGeneration__Artifacts__MaximumBytes: {{ .Values.codeGeneration.artifacts.maximumBytes | quote }}
  CodeGeneration__Artifacts__MaximumPackages: {{ .Values.codeGeneration.artifacts.maximumPackages | quote }}
{{- end }}
{{- if eq (include "fullnet.codeGenerationApplyEnabled" .) "true" }}
  CodeGeneration__Apply__Enabled: "true"
  CodeGeneration__Apply__WorkspaceRoot: {{ .Values.codeGeneration.apply.workspaceRoot | quote }}
  CodeGeneration__Apply__DistributedGateEnabled: {{ .Values.codeGeneration.apply.distributedGateEnabled | quote }}
  CodeGeneration__Apply__MaxRollbackChainLength: {{ .Values.codeGeneration.apply.maxRollbackChainLength | quote }}
  CodeGeneration__CheckpointRetention__Enabled: {{ .Values.codeGeneration.checkpointRetention.enabled | quote }}
  CodeGeneration__CheckpointRetention__RetentionDays: {{ .Values.codeGeneration.checkpointRetention.retentionDays | quote }}
  CodeGeneration__CheckpointRetention__PollSeconds: {{ .Values.codeGeneration.checkpointRetention.pollSeconds | quote }}
  CodeGeneration__CheckpointRetention__MaxDeletesPerRun: {{ .Values.codeGeneration.checkpointRetention.maxDeletesPerRun | quote }}
  CodeGeneration__CheckpointRetention__MaxCheckpointCount: {{ .Values.codeGeneration.checkpointRetention.maxCheckpointCount | quote }}
{{- end }}
{{- if .Values.roles.worker }}
  Realtime__Enabled: "true"
{{- end }}
