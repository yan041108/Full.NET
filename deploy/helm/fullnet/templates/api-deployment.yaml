{{- include "fullnet.validate" . -}}
{{- if .Values.roles.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullnet.fullname" . }}-api
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fullnet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "fullnet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "fullnet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "fullnet.image" (dict "root" . "role" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fullnet.fullname" . }}-config
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.connectionSecretName }}
                  key: {{ .Values.database.connectionSecretKey }}
            - name: Cache__RedisConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cache.redisSecretName }}
                  key: {{ .Values.cache.redisSecretKey }}
            - name: Realtime__RedisBackplaneConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realtime.redisSecretName }}
                  key: {{ .Values.realtime.redisSecretKey }}
            - name: DataProtection__KeyRingPath
              value: /var/fullnet/data-protection-keys
          volumeMounts:
            - name: data-protection
              mountPath: /var/fullnet/data-protection-keys
            - name: tmp
              mountPath: /tmp
{{- if eq (include "fullnet.codeGenerationApplyEnabled" .) "true" }}
            - name: codegeneration-workspace
              mountPath: {{ .Values.codeGeneration.apply.workspaceRoot }}
{{- end }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.api.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-protection
          persistentVolumeClaim:
            claimName: {{ if .Values.dataProtection.existingClaimName }}{{ .Values.dataProtection.existingClaimName }}{{ else }}{{ include "fullnet.fullname" . }}-data-protection{{ end }}
{{- if eq (include "fullnet.codeGenerationApplyEnabled" .) "true" }}
        - name: codegeneration-workspace
          persistentVolumeClaim:
            claimName: {{ include "fullnet.codeGenerationWorkspaceClaimName" . }}
{{- end }}
      {{- if .Values.api.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.api.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.api.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "fullnet.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
