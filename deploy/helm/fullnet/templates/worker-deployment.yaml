{{- include "fullnet.validate" . -}}
{{- if .Values.roles.worker }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullnet.fullname" . }}-worker
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fullnet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "fullnet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "fullnet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "fullnet.image" (dict "root" . "role" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "fullnet.fullname" . }}-config
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.connectionSecretName }}
                  key: {{ .Values.database.connectionSecretKey }}
{{- if eq .Values.worker.messaging.mode "CdcKafka" }}
            - name: Messaging__Kafka__Enabled
              value: "true"
            - name: Messaging__Kafka__BootstrapServers
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.messaging.kafka.bootstrapSecretName }}
                  key: {{ .Values.worker.messaging.kafka.bootstrapSecretKey }}
            - name: Messaging__Kafka__ClientId
              value: {{ printf "%s-worker" (include "fullnet.fullname" .) | quote }}
            - name: Messaging__Kafka__ConsumerInstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Messaging__Kafka__ConsumerGroupProtocol
              value: {{ .Values.worker.messaging.kafka.consumerGroupProtocol | quote }}
            - name: Messaging__Kafka__BrokerMajorVersion
              value: {{ .Values.worker.messaging.kafka.brokerMajorVersion | quote }}
            - name: Messaging__Kafka__ClassicPartitionAssignment
              value: {{ .Values.worker.messaging.kafka.classicPartitionAssignment | quote }}
            - name: Messaging__Kafka__CooperativeStickyMigrationCompleted
              value: {{ .Values.worker.messaging.kafka.cooperativeStickyMigrationCompleted | quote }}
            - name: Messaging__Kafka__ProducerLingerMilliseconds
              value: {{ .Values.worker.messaging.kafka.producerLingerMilliseconds | quote }}
            - name: Messaging__Kafka__ProducerBatchSizeBytes
              value: {{ .Values.worker.messaging.kafka.producerBatchSizeBytes | quote }}
            - name: Messaging__Kafka__ProducerQueueMaxMessages
              value: {{ .Values.worker.messaging.kafka.producerQueueMaxMessages | quote }}
            - name: Messaging__Kafka__ProducerQueueMaxKbytes
              value: {{ .Values.worker.messaging.kafka.producerQueueMaxKbytes | quote }}
            - name: Messaging__Kafka__ProducerMaxInFlightRequests
              value: {{ .Values.worker.messaging.kafka.producerMaxInFlightRequests | quote }}
            - name: Messaging__Kafka__ConsumerBufferHighWatermark
              value: {{ .Values.worker.messaging.kafka.consumerBufferHighWatermark | quote }}
            - name: Messaging__Kafka__ConsumerBufferLowWatermark
              value: {{ .Values.worker.messaging.kafka.consumerBufferLowWatermark | quote }}
            - name: Messaging__Kafka__PartitionBufferHighWatermark
              value: {{ .Values.worker.messaging.kafka.partitionBufferHighWatermark | quote }}
            - name: Messaging__Kafka__PartitionBufferLowWatermark
              value: {{ .Values.worker.messaging.kafka.partitionBufferLowWatermark | quote }}
            - name: Messaging__Kafka__PartitionKeyConcurrencySlots
              value: {{ .Values.worker.messaging.kafka.partitionKeyConcurrencySlots | quote }}
            - name: Messaging__Kafka__OffsetCommitMode
              value: {{ .Values.worker.messaging.kafka.offsetCommitMode | quote }}
            - name: Messaging__Kafka__OffsetCommitIntervalMilliseconds
              value: {{ .Values.worker.messaging.kafka.offsetCommitIntervalMilliseconds | quote }}
            - name: Messaging__Kafka__OffsetCommitBatchSize
              value: {{ .Values.worker.messaging.kafka.offsetCommitBatchSize | quote }}
            - name: Messaging__Kafka__PeriodicOffsetCommitVerified
              value: {{ .Values.worker.messaging.kafka.periodicOffsetCommitVerified | quote }}
{{- end }}
            - name: Cache__RedisConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cache.redisSecretName }}
                  key: {{ .Values.cache.redisSecretKey }}
            - name: Realtime__RedisBackplaneConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realtime.redisSecretName }}
                  key: {{ .Values.realtime.redisSecretKey }}
            - name: DataProtection__KeyRingPath
              value: /var/fullnet/data-protection-keys
          volumeMounts:
            - name: data-protection
              mountPath: /var/fullnet/data-protection-keys
            - name: tmp
              mountPath: /tmp
{{- if eq (include "fullnet.codeGenerationApplyEnabled" .) "true" }}
            - name: codegeneration-workspace
              mountPath: {{ .Values.codeGeneration.apply.workspaceRoot }}
{{- end }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.worker.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-protection
          persistentVolumeClaim:
            claimName: {{ if .Values.dataProtection.existingClaimName }}{{ .Values.dataProtection.existingClaimName }}{{ else }}{{ include "fullnet.fullname" . }}-data-protection{{ end }}
{{- if eq (include "fullnet.codeGenerationApplyEnabled" .) "true" }}
        - name: codegeneration-workspace
          persistentVolumeClaim:
            claimName: {{ include "fullnet.codeGenerationWorkspaceClaimName" . }}
{{- end }}
      {{- if .Values.worker.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.worker.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.worker.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.worker.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "fullnet.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      {{- end }}
{{- end }}
