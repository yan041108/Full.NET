{{- include "fullnet.validate" . -}}
{{- if and .Values.roles.worker .Values.worker.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fullnet.fullname" . }}-worker
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fullnet.fullname" . }}-worker
  minReplicas: {{ .Values.worker.hpa.minReplicas }}
  maxReplicas: {{ .Values.worker.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.hpa.targetCPUUtilizationPercentage }}
    {{- if .Values.worker.hpa.customMetrics.enabled }}
    - type: External
      external:
        metric:
          name: {{ .Values.worker.hpa.customMetrics.metricName | quote }}
        target:
          type: Value
          value: {{ .Values.worker.hpa.customMetrics.query | quote }}
    {{- end }}
{{- end }}
