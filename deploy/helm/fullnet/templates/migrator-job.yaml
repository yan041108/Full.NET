{{- include "fullnet.validate" . -}}
{{- if .Values.roles.migrator }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fullnet.fullname" . }}-migrator
  labels:
    {{- include "fullnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ .Values.migrator.hookWeight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrator.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrator.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "fullnet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "fullnet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrator
          image: {{ include "fullnet.image" (dict "root" . "role" "migrator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            {{- toYaml .Values.migrator.seedArgs | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "fullnet.fullname" . }}-config
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.connectionSecretName }}
                  key: {{ .Values.database.connectionSecretKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migrator.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
