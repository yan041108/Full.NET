# Full.NET 生产 Helm 默认值。生产以三个独立 Release 启用单一角色；
# production=true 时禁止同一 Release 同时启用多个角色。

production: true

# 与 Host 实际环境保持一致；非生产日志入口预览显式设置为 Staging 或 Development。
dotnetEnvironment: Production

roles:
  api: false
  worker: false
  migrator: false

nameOverride: ""
fullnameOverride: ""

image:
  registry: ""
  repository: fullnet
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  # 各角色镜像名：{repository}-api|worker|migrator
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

database:
  provider: SqlServer # SqlServer | MySql
  connectionSecretName: fullnet-database
  connectionSecretKey: connectionString

cache:
  redisSecretName: fullnet-cache-redis
  redisSecretKey: connectionString

realtime:
  redisSecretName: fullnet-realtime-redis
  redisSecretKey: connectionString
  transportMode: Default # Default | WebSocketsOnly
  skipNegotiation: false
  requireSessionAffinity: true

files:
  s3SecretName: fullnet-s3

dataProtection:
  applicationName: Full.NET
  # 优先引用已有 RWX Claim；否则仅在 StorageClass 已验证 RWX/快照/备份时创建 PVC。
  existingClaimName: ""
  certificateSecretName: fullnet-dp-cert
  certificateSecretKey: certificate.pfx
  certificatePasswordSecretKey: password
  persistence:
    create: false
    storageClassName: ""
    storageClassVerifiedRwxSnapshotBackup: false
    size: 1Gi
    accessModes:
      - ReadWriteMany

databaseConnectionBudget:
  # api(12)*40 + worker(8)*10 + migrationReserve(20) = 580；默认留余量。
  total: 600
  apiMaxPoolSize: 40
  workerMaxPoolSize: 10
  migrationReserve: 20
  # 普通准入上限必须为健康检查和 Worker 关键续租/终态写入留下静态余量。
  healthReserve: 2
  workerCriticalReserve: 1
  # 从现有 API 池预算内为提交前独立授权留一份，不挤占健康检查或 Worker 续租许可。
  apiAuthorizationReadReserve: 1
  apiPermitLimit: 37
  apiQueueLimit: 0
  apiAcquireTimeoutMilliseconds: 250
  workerPermitLimit: 7
  workerQueueLimit: 1
  workerAcquireTimeoutMilliseconds: 1000

edgeProtection:
  # 生产必须声明已部署的全局 Edge 能力；Chart 只引用 Secret/Service/注解。
  declared: false
  provider: "" # CDN | WAF | APIGateway | DistributedRateLimit
  globalRateLimitPerSecond: 0
  globalBurst: 0
  globalConcurrentConnections: 0
  authDimension: client_id
  anonymousDimension: client_ip
  unavailablePolicy: fail-closed # fail-open | fail-closed
  secretName: ""
  serviceName: ""
  annotations: {}

# 应用内每实例限流（纵深防御）；扩到 maxReplicas 后总和不得超过全局额度。
applicationRateLimiting:
  globalApiPermitLimitPerMinutePerReplica: 100

logging:
  # Collector 为默认入口；仅发布本地路由标识，采集链仍须单独验证。
  # Collector/ApplicationKafka 本地测试准入后允许生产 API/Worker；Local 仍仅供非生产预览。
  ingress: Collector # Local | Collector | ApplicationKafka
  # 显式成对设置后冻结事件日期索引路由；零值保留未启用状态。
  indexRouteVersion: 0
  indexRetentionDays: 0
  localFile:
    # 仅 Local；Kubernetes 必须显式提供持久卷，单副本且禁用 HPA。
    enabled: false
    directory: /var/fullnet/logs
    existingClaimName: ""
    fileSizeLimitBytes: 67108864
    retentionDays: 14
    maxDirectoryBytes: 1073741824
    # 历史优先日志的保留目标百分比，0–50，0关闭；与普通日志仍共享磁盘，修改须重启。
    priorityReservePercent: 20
    flushInterval: "00:00:01"
  kafka:
    # 仅 ApplicationKafka 使用；配置 Secret 按固定键注入，值不进入 Chart。
    configurationSecretName: ""
    # 私有 CA 时引用独立 Secret 的 ca.crt；空值使用镜像内系统信任根。
    caSecretName: ""

api:
  replicaCount: 3
  kafkaReplay:
    # 同步范围重放默认关闭；启用时必须单独提供 API 角色可读的 Kafka Secret。
    enabled: false
    bootstrapSecretName: ""
    bootstrapSecretKey: bootstrapServers
    securityProtocol: Ssl
    saslMechanism: ""
    saslUsernameSecretName: ""
    saslUsernameSecretKey: username
    saslPasswordSecretName: ""
    saslPasswordSecretKey: password
    maximumSynchronousMessages: 1000
    executionTimeoutSeconds: 45
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 10
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    customMetrics:
      enabled: false
      adapterInstalledAndVerified: false
      query: ""
      metricName: ""
  pdb:
    enabled: true
    minAvailable: 2
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: true
    className: nginx
    host: fullnet.example.com
    tlsSecretName: ""
    bodySize: 32m
    proxyConnectTimeout: "10"
    proxySendTimeout: "60"
    proxyReadTimeout: "60"
    # 可信代理链由集群入口配置；禁止信任任意客户端 X-Forwarded-For。
    useForwardedHeaders: true
    trustedProxyAnnotationKey: nginx.ingress.kubernetes.io/configuration-snippet
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

worker:
  replicaCount: 2
  maxConcurrency: 1
  databaseCapacityBackoffMilliseconds: 1000
  messaging:
    mode: LegacyPolling
    # 只读 CDC 观测默认关闭；显式启用前配置数据库读取权限和专用控制面映射。
    cdcMonitoring:
      enabled: false
      pollSeconds: 30
      sampleTimeoutSeconds: 10
      maximumSampleAgeSeconds: 120
      retentionTimeTopicId: ""
      # 多流按目录Topic机器码分别确认不可变ID，不能把单流ID复用于其它流。
      retentionTimeTopics: {}
      maximumBrokerClockSkewSeconds: 5
    kafka:
      bootstrapSecretName: ""
      bootstrapSecretKey: bootstrapServers
      consumerGroupProtocol: Classic
      brokerMajorVersion: 4
      classicPartitionAssignment: LegacyRange
      cooperativeStickyMigrationCompleted: false
      producerLingerMilliseconds: 5
      producerBatchSizeBytes: 65536
      producerQueueMaxMessages: 20000
      producerQueueMaxKbytes: 65536
      producerMaxInFlightRequests: 5
      consumerBufferHighWatermark: 256
      consumerBufferLowWatermark: 128
      partitionBufferHighWatermark: 1
      partitionBufferLowWatermark: 0
      partitionKeyConcurrencySlots: 1
      offsetCommitMode: PerMessage
      offsetCommitIntervalMilliseconds: 1000
      offsetCommitBatchSize: 100
      periodicOffsetCommitVerified: false
  terminationGracePeriodSeconds: 90
  preStopSleepSeconds: 15
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    customMetrics:
      enabled: false
      adapterInstalledAndVerified: false
      query: ""
      metricName: ""
  pdb:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

migrator:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  hookWeight: "-5"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  seedArgs: []

networkPolicy:
  enabled: true
  # 仅允许入口来自 ingress-nginx 命名空间与同 Release 标签；出口放行 DNS 与外部依赖。
  ingressNamespace: ingress-nginx
  ingressPodSelector:
    app.kubernetes.io/name: ingress-nginx

# Host 代码生成 Apply/Rollback 默认关闭；所有环境均须显式启用并配置工作区卷。
# 业务运行镜像不携带 SDK/Git，涉及编译或提交时使用受控开发/构建环境的 CLI。
codeGeneration:
  # 归档独立于 Apply；启用受跟踪预览前显式提供具有一致文件锁语义的共享 PVC。
  artifacts:
    enabled: false
    existingClaimName: ""
    rootDirectory: /var/fullnet/codegeneration-artifacts
    retentionDays: 30
    maximumBytes: 536870912
    maximumPackages: 4096
  apply:
    enabled: false
    workspaceRoot: /var/fullnet/codegeneration
    distributedGateEnabled: true
    maxRollbackChainLength: 16
  checkpointRetention:
    enabled: true
    retentionDays: 7
    pollSeconds: 300
    maxDeletesPerRun: 32
    maxCheckpointCount: 128
  workspace:
    existingClaimName: ""
    persistence:
      create: false
      storageClassVerifiedRwxSnapshotBackup: false
      size: 5Gi

nodeSelector: {}
tolerations: []
affinity: {}
