# Development / test only. Production Kafka and Connect are platform-owned.
# Pinned images - never use :latest in this overlay.

services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: fullnet-dev-kafka-cluster-01

  connect:
    image: quay.io/debezium/connect:3.4.3.Final
    hostname: connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: fullnet-debezium-connect
      CONFIG_STORAGE_TOPIC: fullnet.dev.shadow.internal.connect-config
      OFFSET_STORAGE_TOPIC: fullnet.dev.shadow.internal.connect-offsets
      STATUS_STORAGE_TOPIC: fullnet.dev.shadow.internal.connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      FULLNET_SQLSERVER_HOST: ${FULLNET_SQLSERVER_HOST:-host.docker.internal}
      FULLNET_SQLSERVER_PORT: ${FULLNET_SQLSERVER_PORT:-1433}
      FULLNET_SQLSERVER_USER: ${FULLNET_SQLSERVER_USER:-fullnet_cdc_reader}
      FULLNET_SQLSERVER_PASSWORD: ${FULLNET_SQLSERVER_PASSWORD:-replace-me}
      FULLNET_SQLSERVER_DATABASE: ${FULLNET_SQLSERVER_DATABASE:-fullnet_dev}
      FULLNET_MYSQL_HOST: ${FULLNET_MYSQL_HOST:-host.docker.internal}
      FULLNET_MYSQL_PORT: ${FULLNET_MYSQL_PORT:-3306}
      FULLNET_MYSQL_USER: ${FULLNET_MYSQL_USER:-fullnet_cdc_reader}
      FULLNET_MYSQL_PASSWORD: ${FULLNET_MYSQL_PASSWORD:-replace-me}
      FULLNET_MYSQL_DATABASE: ${FULLNET_MYSQL_DATABASE:-fullnet_dev}