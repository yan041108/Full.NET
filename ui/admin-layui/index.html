<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172027">
    <meta name="description" content="Full.NET Layui 管理端">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Full.NET · 管理控制台</title>
  </head>
  <body>
    <a class="fn-skip-link" href="#main-content" data-skip-link data-i18n="a11y.skipToMain"></a>
    <div class="fn-context-problem" data-locale-problem role="alert" aria-live="assertive" hidden></div>
    <div id="main-content" tabindex="-1">
    <section class="fn-session-boot" data-session-boot aria-live="polite">
      <span>F</span>
      <strong data-i18n="session.restoring"></strong>
      <i aria-hidden="true"></i>
    </section>

    <main class="fn-login" data-login-view hidden>
      <section class="fn-login__signal" data-i18n-aria-label="auth.platformDescription">
        <div class="fn-login__brand"><span>F</span><div><strong>Full.NET</strong><small>ADMIN CONSOLE</small></div></div>
        <div class="fn-login__statement">
          <p data-i18n="auth.node"></p>
          <h1 data-route-heading tabindex="-1"><span data-i18n="auth.heroLineOne"></span><br><em data-i18n="auth.heroLineTwo"></em></h1>
          <span data-i18n="auth.heroDescription"></span>
        </div>
        <div class="fn-login__facts">
          <div><b translate="no">10m</b><span data-i18n="auth.accessWindow"></span></div>
          <div><b translate="no">RSA</b><span data-i18n="auth.signingRing"></span></div>
          <div><b translate="no">2×DB</b><span data-i18n="auth.providerParity"></span></div>
        </div>
      </section>

      <section class="fn-login__panel">
        <form class="layui-form" data-login-form aria-labelledby="login-form-title">
          <header>
            <span>01 / <span data-i18n="auth.authenticate"></span></span>
            <label class="fn-locale" for="login-locale"><span data-i18n="locale.label"></span><select id="login-locale" name="locale" data-locale-select><option value="zh-CN" data-i18n="locale.zhCN"></option><option value="en-US" data-i18n="locale.enUS"></option></select></label>
          </header>
          <h2 id="login-form-title" data-i18n="auth.title"></h2>
          <p data-i18n="auth.statusAnonymous"></p>
          <div class="layui-form-item">
            <label for="login-username" data-i18n="auth.username"></label>
            <input id="login-username" class="layui-input" name="username" autocomplete="username" spellcheck="false" maxlength="128" required data-i18n-placeholder="auth.usernamePlaceholder">
          </div>
          <div class="layui-form-item">
            <label for="login-password" data-i18n="auth.password"></label>
            <input id="login-password" class="layui-input" name="password" type="password" autocomplete="current-password" maxlength="1024" required data-i18n-placeholder="auth.passwordPlaceholder">
          </div>
          <div class="fn-login__problem" data-login-problem role="alert" aria-live="assertive" hidden>
            <strong data-login-error-code translate="no"></strong>
            <span data-login-error-title></span>
          </div>
          <button class="layui-btn fn-login__submit" type="submit"><span data-i18n="auth.submit"></span><b aria-hidden="true">→</b></button>
          <small data-i18n="auth.tokenNotice"></small>
        </form>
      </section>
    </main>

    <div class="fn-shell" data-client-kind="layui" data-session-shell hidden>
      <aside class="fn-sidebar">
        <a class="fn-brand" href="#/" data-i18n-aria-label="shell.brandAria">
          <span class="fn-brand__mark">F</span>
          <span><strong>Full.NET</strong><small>ADMIN CONSOLE</small></span>
        </a>

        <div class="fn-tenant">
          <span class="fn-tenant__label" data-i18n="shell.currentTenant"></span>
          <strong data-current-context translate="no"></strong>
          <span class="fn-tenant__meta"><i aria-hidden="true"></i><span data-current-context-scope translate="no"></span></span>
        </div>

        <nav class="fn-nav" data-navigation data-i18n-aria-label="shell.mainNavigation"></nav>

        <div class="fn-sidebar__footer">
          <span class="fn-avatar" aria-hidden="true">FN</span>
          <span><strong data-current-user></strong><small data-current-scope></small></span>
          <button data-session-logout type="button" data-i18n-aria-label="shell.logout"><i class="layui-icon layui-icon-logout" aria-hidden="true"></i></button>
        </div>
      </aside>

      <section class="fn-stage">
        <header class="fn-topbar">
          <div class="fn-topbar__context"><span data-i18n="shell.controlPlane"></span><i>/</i><strong data-route-title></strong></div>
          <div class="fn-topbar__actions">
            <label
              class="fn-context-selector"
              data-context-selector
              data-permission="tenancy.tenants.switch"
            >
               <span data-i18n="shell.tenantSelector"></span>
               <select data-context-select data-i18n-aria-label="shell.tenantSelector"></select>
             </label>
             <label class="fn-locale" for="shell-locale"><span data-i18n="locale.label"></span><select id="shell-locale" name="locale" data-locale-select><option value="zh-CN" data-i18n="locale.zhCN"></option><option value="en-US" data-i18n="locale.enUS"></option></select></label>
             <button type="button" data-i18n-aria-label="shell.search"><i class="layui-icon layui-icon-search" aria-hidden="true"></i></button>
             <button type="button" data-i18n-aria-label="shell.notifications" class="has-signal"><i class="layui-icon layui-icon-notice" aria-hidden="true"></i></button>
             <span class="fn-clock"><small data-i18n="shell.systemTime"></small><strong translate="no">UTC +08:00</strong></span>
          </div>
        </header>

        <div class="fn-context-problem" data-context-problem role="alert" hidden>
          <strong data-context-error-code translate="no"></strong>
          <span data-context-error-title></span>
        </div>

        <div class="fn-content">
          <main data-route-view="overview" class="fn-overview">
            <section class="fn-heading">
              <div>
                <p data-i18n="overview.eyebrow"></p>
                <h1 data-route-heading tabindex="-1" data-i18n="overview.title"></h1>
                <span data-i18n="overview.summary"></span>
              </div>
              <div class="fn-heading__actions">
                <span class="fn-live"><i aria-hidden="true"></i><span data-i18n="overview.live"></span></span>
                <button class="layui-btn fn-probe" type="button" data-testid="load-current-user">
                  <i class="layui-icon layui-icon-vercode" aria-hidden="true"></i><span data-i18n="overview.probe"></span>
                </button>
              </div>
            </section>

            <section class="fn-metrics" data-i18n-aria-label="overview.metricsLabel">
              <article data-tone="jade"><span data-i18n="overview.metric.activeTenants"></span><strong>128</strong><em>+12.4% <small data-i18n="overview.comparedYesterday"></small></em></article>
              <article data-tone="cyan"><span data-i18n="overview.metric.onlineUsers"></span><strong>2,406</strong><em>+8.1% <small data-i18n="overview.comparedYesterday"></small></em></article>
              <article data-tone="amber"><span data-i18n="overview.metric.todayRequests"></span><strong>86.2k</strong><em>+18.7% <small data-i18n="overview.comparedYesterday"></small></em></article>
              <article data-tone="rose"><span data-i18n="overview.metric.errorRate"></span><strong>0.08%</strong><em>-0.03% <small data-i18n="overview.comparedYesterday"></small></em></article>
            </section>

            <section class="fn-contract" data-contract-result hidden>
              <span data-i18n="overview.verifySession"></span>
              <strong data-testid="error-code" translate="no"></strong>
              <code data-testid="trace-id" translate="no"></code>
            </section>

            <section class="fn-grid">
              <article class="fn-panel fn-panel--chart">
                <header><div><b>01</b><h2 data-i18n="overview.trafficTitle"></h2></div><span data-i18n="overview.lastTwelveHours"></span></header>
                <div class="fn-chart" role="img" data-i18n-aria-label="overview.chartLabel">
                  <div class="fn-chart__scale"><span>120k</span><span>80k</span><span>40k</span><span>0</span></div>
                  <svg viewBox="0 0 760 250" preserveAspectRatio="none" aria-hidden="true">
                    <defs><linearGradient id="layui-signal-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b8f87" stop-opacity=".32"/><stop offset="1" stop-color="#0b8f87" stop-opacity=".01"/></linearGradient></defs>
                    <g class="fn-chart__grid"><line x1="0" y1="40" x2="760" y2="40"/><line x1="0" y1="105" x2="760" y2="105"/><line x1="0" y1="170" x2="760" y2="170"/><line x1="0" y1="235" x2="760" y2="235"/></g>
                    <path class="fn-chart__area" d="M0,218 C60,212 78,168 130,176 C176,184 188,78 244,94 C294,108 304,158 360,142 C422,123 442,48 498,69 C550,88 566,151 622,136 C680,121 710,82 760,102 L760,250 L0,250 Z"/>
                    <path class="fn-chart__line" d="M0,218 C60,212 78,168 130,176 C176,184 188,78 244,94 C294,108 304,158 360,142 C422,123 442,48 498,69 C550,88 566,151 622,136 C680,121 710,82 760,102"/>
                    <circle cx="244" cy="94" r="5"/><circle cx="498" cy="69" r="5"/>
                  </svg>
                  <div class="fn-chart__axis"><span>00:00</span><span>03:00</span><span>06:00</span><span>09:00</span><span>12:00</span></div>
                </div>
              </article>

              <article class="fn-panel fn-pulse">
                <header><div><b>02</b><h2 data-i18n="overview.pulseTitle"></h2></div><i class="fn-dot" aria-hidden="true"></i></header>
                <div class="fn-pulse__score"><strong>98.6</strong><span data-i18n="overview.healthScore"></span></div>
                <div class="fn-pulse__list">
                  <div><span data-i18n="overview.apiAvailability"></span><div class="layui-progress"><div class="layui-progress-bar" role="progressbar" aria-valuenow="99" aria-valuemin="0" aria-valuemax="100" lay-percent="99%" style="width:99%" data-i18n-aria-label="overview.apiAvailability"></div></div></div>
                  <div><span data-i18n="overview.cacheHitRate"></span><div class="layui-progress"><div class="layui-progress-bar" role="progressbar" aria-valuenow="94" aria-valuemin="0" aria-valuemax="100" lay-percent="94%" style="width:94%" data-i18n-aria-label="overview.cacheHitRate"></div></div></div>
                  <div><span data-i18n="overview.jobPunctuality"></span><div class="layui-progress"><div class="layui-progress-bar" role="progressbar" aria-valuenow="97" aria-valuemin="0" aria-valuemax="100" lay-percent="97%" style="width:97%" data-i18n-aria-label="overview.jobPunctuality"></div></div></div>
                </div>
              </article>

              <article class="fn-panel fn-activity">
                <header><div><b>03</b><h2 data-i18n="overview.activityTitle"></h2></div><button type="button" data-i18n="overview.viewAll"></button></header>
                <ol>
                  <li><span>01</span><div><strong data-i18n="overview.activity.tenantInitialized"></strong><small data-i18n="overview.activity.twoMinutes"></small></div><em data-i18n="overview.status.success"></em></li>
                  <li><span>02</span><div><strong data-i18n="overview.activity.policySynced"></strong><small data-i18n="overview.activity.eighteenMinutes"></small></div><em data-i18n="overview.status.synced"></em></li>
                  <li><span>03</span><div><strong data-i18n="overview.activity.sqlServerVerified"></strong><small data-i18n="overview.activity.fortyOneMinutes"></small></div><em data-i18n="overview.status.passed"></em></li>
                  <li><span>04</span><div><strong data-i18n="overview.activity.mysqlInspection"></strong><small data-i18n="overview.activity.oneHour"></small></div><em data-i18n="overview.status.running"></em></li>
                </ol>
              </article>

              <article class="fn-panel fn-todo">
                <header><div><b>04</b><h2 data-i18n="overview.todoTitle"></h2></div><span data-i18n="overview.todoCount"></span></header>
                <div><button type="button"><span data-i18n="overview.todo.permissionReview"></span><strong>08</strong></button><button type="button"><span data-i18n="overview.todo.tenantApproval"></span><strong>03</strong></button><button type="button"><span data-i18n="overview.todo.alertAcknowledgement"></span><strong>01</strong></button></div>
              </article>
            </section>
          </main>

          <main data-route-view="tenant-context" class="fn-tenant-view" hidden>
            <section class="fn-tenant-heading">
              <div>
                <p data-i18n="tenant.eyebrow"></p>
                <h1 data-route-heading tabindex="-1" data-i18n="tenant.title"></h1>
                <span data-i18n="tenant.description"></span>
              </div>
              <em data-i18n="tenant.sessionBound"></em>
            </section>

            <section class="fn-current-context" data-i18n-aria-label="tenant.currentAria">
              <div><i aria-hidden="true"></i><span data-i18n="tenant.currentLabel"></span></div>
              <strong data-current-context translate="no"></strong>
              <code data-current-context-scope translate="no"></code>
            </section>

            <section class="fn-tenant-directory" aria-labelledby="tenant-directory-title">
              <header>
                <div><b>01</b><h2 id="tenant-directory-title" data-i18n="tenant.availableTitle"></h2></div>
                <span data-i18n="tenant.availableSubtitle"></span>
              </header>
              <div class="fn-tenant-grid" data-tenant-directory></div>
            </section>
          </main>

          <main data-route-view="status" class="fn-status" hidden>
            <div class="fn-status__code" data-status-code></div>
            <p data-i18n="status.routeKicker"></p>
            <h1 data-status-title data-route-heading tabindex="-1"></h1>
            <span data-status-description></span>
            <a class="layui-btn" href="#/" data-i18n="status.back"></a>
          </main>
        </div>
      </section>
    </div>
    <section
      class="fn-component-locale-fixture"
      data-component-locale-fixture
      aria-label="Component locale verification"
      hidden
    >
      <input type="text" data-component-locale-date />
      <div data-component-locale-pagination></div>
    </section>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
