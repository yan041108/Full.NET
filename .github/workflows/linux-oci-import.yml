name: linux-oci-import

on:
  workflow_dispatch:
    inputs:
      oci_run_id:
        description: Successful main linux-oci-candidate run ID
        required: true
        type: string
      verify_hosts:
        description: Verify Testing hosts with an isolated disposable MySQL database
        required: true
        default: false
        type: boolean
      host_environment:
        description: Isolated host configuration to verify when verify_hosts is true
        required: true
        default: Testing
        type: choice
        options:
          - Testing
          - Production

permissions:
  contents: read
  actions: read

jobs:
  verification:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the upstream OCI run
        id: upstream
        uses: actions/github-script@v7
        env:
          OCI_RUN_ID: ${{ inputs.oci_run_id }}
        with:
          script: |
            const id = process.env.OCI_RUN_ID;
            if (!/^[1-9][0-9]{0,14}$/.test(id)) throw new Error('oci_run_id_invalid');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
            if (run.path !== '.github/workflows/linux-oci-candidate.yml' ||
                run.head_branch !== 'main' || run.event !== 'workflow_dispatch' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.status !== 'completed' || run.conclusion !== 'success') throw new Error('oci_run_untrusted');
            const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: id});
            if (artifacts.total_count !== 1 || artifacts.artifacts.length !== 1) throw new Error('oci_artifact_ambiguous');
            const artifact = artifacts.artifacts[0];
            const match = /^fullnet-linux-oci-([0-9a-f]{40})$/.exec(artifact.name);
            if (!match || artifact.expired) throw new Error('oci_artifact_invalid');
            core.setOutput('source', match[1]);
            core.setOutput('packaging', run.head_sha);
            core.setOutput('artifact', artifact.name);
      - name: Prepare owned staging
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          stage="$RUNNER_TEMP/fullnet-linux-oci-import"
          test ! -e "$stage"
          mkdir -m 0700 "$stage"
          echo "FULLNET_OCI_IMPORT=$stage" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.upstream.outputs.artifact }}
          path: ${{ env.FULLNET_OCI_IMPORT }}/input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.oci_run_id }}
      - name: Install the local OCI importer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
      - name: Import and inspect only the candidate images
        env:
          OCI_SOURCE: ${{ steps.upstream.outputs.source }}
          OCI_PACKAGING: ${{ steps.upstream.outputs.packaging }}
          OCI_RUN_ID: ${{ inputs.oci_run_id }}
          VERIFY_HOSTS: ${{ inputs.verify_hosts }}
          HOST_ENVIRONMENT: ${{ inputs.host_environment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile
          root = pathlib.Path(os.environ['FULLNET_OCI_IMPORT'])
          incoming = root / 'input'
          roles = ('migrator', 'worker', 'api')
          socket = 'unix:///var/run/docker.sock'
          source = os.environ['OCI_SOURCE']
          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)
          def run(command, seconds=60):
              return subprocess.check_output(command, text=True, timeout=seconds).strip()
          def docker(*arguments):
              return ['docker', '--host', socket, *arguments]
          def digest(path):
              with path.open('rb') as stream:
                  return 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
          require(os.environ.get('DOCKER_HOST', socket) == socket, 'remote_docker_rejected')
          require(pathlib.Path('/var/run/docker.sock').is_socket(), 'local_docker_required')
          receipt = json.loads((incoming / 'candidate.json').read_text())
          require(type(receipt['schemaVersion']) is int and receipt['schemaVersion'] == 1 and
                  receipt['scope'] == 'linux-jit-oci' and receipt['sourceCommit'] == source and
                  receipt['packagingCommit'] == os.environ['OCI_PACKAGING'] and
                  receipt['runtimeIdentifier'] == 'linux-x64' and receipt['imageBuildVerified'] is True and
                  set(receipt['roles']) == set(roles), 'oci_receipt_invalid')
          expected_names = {'candidate.json'}
          for role in roles:
              name = 'fullnet-' + role + '-' + source + '.oci.tar'
              expected_names.update((name, name + '.manifest.json'))
          require({p.name for p in incoming.iterdir()} == expected_names and
                  all(p.is_file() and not p.is_symlink() for p in incoming.iterdir()), 'oci_input_set_invalid')
          configurations = {}
          # 所有归档先核对，再对本机引擎产生导入动作；不启动业务入口。
          for role in roles:
              entry = receipt['roles'][role]
              name = 'fullnet-' + role + '-' + source + '.oci.tar'
              require(entry['archive'] == name and entry['role'] == role and entry['status'] == 'packed' and
                      digest(incoming / name) == entry['archiveSha256'], 'oci_archive_mismatch')
              with tarfile.open(incoming / name, 'r:') as archive:
                  members = archive.getmembers()
                  require(all(m.isfile() for m in members) and len({m.name for m in members}) == len(members),
                          'oci_archive_entries_invalid')
                  def blob(descriptor):
                      require(re.fullmatch(r'sha256:[0-9a-f]{64}', descriptor['digest']), 'oci_digest_invalid')
                      member = archive.getmember('blobs/sha256/' + descriptor['digest'][7:])
                      require(member.size == descriptor['size'], 'oci_blob_size_invalid')
                      with archive.extractfile(member) as stream:
                          require('sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest() == descriptor['digest'],
                                  'oci_blob_digest_invalid')
                      return member
                  index = json.load(archive.extractfile('index.json'))
                  require(len(index['manifests']) == 1, 'oci_index_invalid')
                  descriptor = index['manifests'][0]
                  require(descriptor['digest'] == entry['manifestDigest'], 'oci_manifest_mismatch')
                  manifest = json.load(archive.extractfile(blob(descriptor)))
                  require(json.loads((incoming / (name + '.manifest.json')).read_text()) == manifest,
                          'oci_sidecar_mismatch')
                  configuration = json.load(archive.extractfile(blob(manifest['config'])))
                  for layer in manifest['layers']:
                      blob(layer)
                  require(manifest['layers'][:-1] == receipt['runtimeLayers'] and
                          configuration['os'] == 'linux' and configuration['architecture'] == 'amd64' and
                          configuration['config']['User'] == '1654' and configuration['config']['WorkingDir'] == '/app' and
                          configuration['config']['Entrypoint'] == ['dotnet', 'Full.NET.Host.' + role.capitalize() + '.dll'],
                          'oci_configuration_invalid')
                  configurations[role] = configuration
          owned, results = [], {}
          for role in roles:
              reference = 'fullnet-oci-import-' + role + ':' + os.environ['GITHUB_RUN_ID']
              container = 'fullnet-oci-import-' + role + '-' + os.environ['GITHUB_RUN_ID']
              require(not run(docker('image', 'ls', '-q', '--filter', 'reference=' + reference)), 'image_already_exists')
              require(not run(docker('ps', '-aq', '--filter', 'name=^/' + container + '$')), 'container_already_exists')
              # 在首次导入前登记独占名称，失败后的独立清理步骤也能回收已创建资源。
              owned.append({'image': reference, 'container': container})
              (root / 'owned.json').write_text(json.dumps(owned))
              entry = receipt['roles'][role]
              run(['sudo', '-n', 'skopeo', 'copy', '--dest-daemon-host', socket, '--format', 'v2s2',
                   'oci-archive:' + str(incoming / entry['archive']), 'docker-daemon:' + reference], 240)
              image = json.loads(run(docker('image', 'inspect', reference)))[0]
              configuration = configurations[role]
              require(image['Os'] == 'linux' and image['Architecture'] == 'amd64' and
                      image['Config']['User'] == '1654' and image['Config']['WorkingDir'] == '/app' and
                      image['Config']['Entrypoint'] == configuration['config']['Entrypoint'] and
                      (image['Config']['Cmd'] or []) == configuration['config']['Cmd'] and
                      image['Config']['Env'] == configuration['config']['Env'] and
                      image['RootFS']['Layers'] == configuration['rootfs']['diff_ids'], 'docker_import_mismatch')
              runtimes = run(docker('run', '--rm', '--name', container, '--network', 'none', '--read-only',
                                   '--memory', '128m', '--cpus', '1', '--pids-limit', '64', '--cap-drop', 'ALL',
                                   '--security-opt', 'no-new-privileges', '--entrypoint', 'dotnet', reference,
                                   '--list-runtimes'), 30)
              for framework in ('Microsoft.NETCore.App', 'Microsoft.AspNetCore.App'):
                  require(re.search(r'^' + re.escape(framework) + r' 10\.0\.\d+ \[', runtimes, re.MULTILINE),
                          'dotnet_runtime_missing')
              results[role] = {'imageId': image['Id'], 'archiveSha256': entry['archiveSha256'],
                               'manifestDigest': entry['manifestDigest'], 'rootfsDiffIds': image['RootFS']['Layers'],
                               'runtimeDiscovery': runtimes.splitlines()}
              print('oci_import_verified: role=' + role + ' image=' + image['Id'] + ' runtimes=net10+aspnet10', flush=True)
          result = {'schemaVersion': 1, 'scope': 'linux-oci-import', 'sourceCommit': source,
                    'packagingCommit': receipt['packagingCommit'], 'verificationCommit': os.environ['GITHUB_SHA'],
                    'ociRunId': os.environ['OCI_RUN_ID'], 'candidateReceiptSha256': digest(incoming / 'candidate.json'),
                    'roles': results, 'imageImportVerified': True, 'runtimeDiscoveryVerified': True,
                    'runtimeStartupVerified': False, 'nativeAotVerified': False, 'databaseMigrationVerified': False,
                    'deploymentVerified': False, 'capacityVerified': False}
          if os.environ['VERIFY_HOSTS'] == 'true':
              import importlib.util
              spec = importlib.util.spec_from_file_location('candidate_startup', 'tests/deployment/oci_candidate_startup.py')
              startup = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(startup)
              result['hostVerification'] = startup.verify(root)
              result['runtimeStartupVerified'] = True
              result['databaseMigrationVerified'] = True
          (root / 'verification.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Clean owned engine resources
        id: cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, subprocess
          stage = os.environ.get('FULLNET_OCI_IMPORT')
          if stage:
              spec = importlib.util.spec_from_file_location('candidate_startup', 'tests/deployment/oci_candidate_startup.py')
              startup = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(startup)
              startup.clean(pathlib.Path(stage))
              path = pathlib.Path(stage) / 'owned.json'
              if path.exists():
                  socket = 'unix:///var/run/docker.sock'
                  allowed = [{'image': 'fullnet-oci-import-' + role + ':' + os.environ['GITHUB_RUN_ID'],
                              'container': 'fullnet-oci-import-' + role + '-' + os.environ['GITHUB_RUN_ID']}
                             for role in ('migrator', 'worker', 'api')]
                  owned = json.loads(path.read_text())
                  if not all(item in allowed for item in owned):
                      raise RuntimeError('cleanup_ownership_invalid')
                  def run(*args):
                      return subprocess.check_output(['docker', '--host', socket, *args], text=True, timeout=60).strip()
                  for item in reversed(owned):
                      if run('ps', '-aq', '--filter', 'name=^/' + item['container'] + '$'):
                          run('rm', '-f', item['container'])
                      if run('image', 'ls', '-q', '--filter', 'reference=' + item['image']):
                          run('image', 'rm', item['image'])
                      if run('ps', '-aq', '--filter', 'name=^/' + item['container'] + '$') or run('image', 'ls', '-q', '--filter', 'reference=' + item['image']):
                          raise RuntimeError('cleanup_resources_remaining')
                  print('oci_import_cleanup: owned_images=0 owned_containers=0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fullnet-oci-import-${{ github.run_id }}
          path: ${{ env.FULLNET_OCI_IMPORT }}/verification.json
          if-no-files-found: error
          retention-days: 3
      - name: Clean owned staging
        if: always()
        run: |
          # 仅清理本轮排他创建的暂存；资源清理失败时保留本轮登记供作业内诊断。
          if test '${{ steps.cleanup.outcome }}' = success && test -n "${FULLNET_OCI_IMPORT:-}" && test "$FULLNET_OCI_IMPORT" = "$RUNNER_TEMP/fullnet-linux-oci-import"; then
            rm -rf -- "$FULLNET_OCI_IMPORT"
          fi
