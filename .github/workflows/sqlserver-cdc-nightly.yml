name: SQL Server CDC nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlserver-cdc-nightly
  cancel-in-progress: false

jobs:
  sqlserver-cdc:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Skip when external SQL Server secret is not configured
        id: gate
        shell: bash
        env:
          FULLNET_TEST_SQLSERVER_CDC_CONNECTION_STRING: ${{ secrets.FULLNET_TEST_SQLSERVER_CDC_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          if [[ -z "${FULLNET_TEST_SQLSERVER_CDC_CONNECTION_STRING:-}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FULLNET_TEST_SQLSERVER_CDC_CONNECTION_STRING is not configured; skipping nightly evidence."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build integration tests
        if: steps.gate.outputs.skip != 'true'
        run: >-
          dotnet build
          tests/Full.NET.IntegrationTests/Full.NET.IntegrationTests.csproj
          --configuration Release

      - name: Run SQL Server CDC integration tests (Pass/Fail only)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          FULLNET_TEST_SQLSERVER_CDC_CONNECTION_STRING: ${{ secrets.FULLNET_TEST_SQLSERVER_CDC_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          assembly="tests/Full.NET.IntegrationTests/bin/Release/net10.0/Full.NET.IntegrationTests.dll"
          filter="FullyQualifiedName~SqlServerCdcDebeziumInboxE2ETests|FullyQualifiedName~SqlServerCdcShadowTests|FullyQualifiedName~KafkaOutboxCdcCapacityRunnerTests&FullyQualifiedName~SqlServer|FullyQualifiedName~OrganizationUnitCdcKafkaEndToEndTests&FullyQualifiedName~SqlServer|FullyQualifiedName~OrganizationUnitCdcKafkaFaultMatrixTests&FullyQualifiedName~SqlServer"
          dotnet "$assembly" \
            --no-ansi \
            --progress off \
            --filter "$filter" \
            --report-trx \
            --report-trx-filename Full.NET.IntegrationTests-sqlserver-cdc-nightly.trx
          node scripts/testing/summarize-trx-outcomes.mjs Full.NET.IntegrationTests-sqlserver-cdc-nightly.trx --fail-on-inconclusive

      - name: Upload SQL Server CDC TRX
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlserver-cdc-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: Full.NET.IntegrationTests-sqlserver-cdc-nightly.trx
          if-no-files-found: ignore
          retention-days: 14
