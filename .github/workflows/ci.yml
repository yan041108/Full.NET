name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit client dependencies
        run: |
          pnpm audit:clients
          pnpm licenses list --prod --json > client-production-licenses.json
          pnpm licenses list --json > client-development-licenses.json

      - name: Verify rules governance consistency
        run: pnpm test:governance

      - name: Verify project skills contract
        run: pnpm test:skills

      - name: Verify performance governance
        run: pnpm test:performance-governance

      - name: Verify naming governance
        run: pnpm test:naming

      - name: Verify SQL safety governance
        run: pnpm test:sql-safety

      - name: Test shared and admin client packages
        run: |
          pnpm test:workspace
          pnpm test:localization
          pnpm test:openapi
          pnpm --filter @fullnet/admin-i18n --filter @fullnet/admin --filter @fullnet/admin-layui test

      - name: Verify OpenAPI backward compatibility
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          OPENAPI_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm test:openapi:breaking -- --base-ref "$OPENAPI_BASE_REF"

      - name: Verify uni-app targets
        run: |
          pnpm --filter @fullnet/uniapp test
          pnpm --filter @fullnet/uniapp typecheck
          pnpm --filter @fullnet/uniapp build:h5
          pnpm --filter @fullnet/uniapp build:mp-weixin
          pnpm --filter @fullnet/uniapp build:mp-alipay

      - name: Build client packages
        run: pnpm build:clients

      - name: Verify frontend bundle budgets
        run: pnpm test:bundle-budgets

      - name: Install Playwright Chromium
        run: pnpm --filter @fullnet/uniapp-h5-e2e exec playwright install --with-deps chromium

      - name: Verify uni-app H5
        run: pnpm test:e2e:uniapp

      - name: Verify Vue and Layui parity
        run: pnpm test:e2e

      - name: Upload client quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullnet-client-quality-reports
          path: |
            client-production-licenses.json
            client-development-licenses.json
            tests/e2e/admin-parity/playwright-report/**
            tests/e2e/admin-parity/test-results/**
            tests/e2e/uniapp-h5/playwright-report/**
            tests/e2e/uniapp-h5/test-results/**
          if-no-files-found: warn

  real-stack-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend for real-stack E2E
        run: dotnet build Full.NET.slnx --configuration Release

      - name: Install Playwright Chromium
        run: pnpm --filter @fullnet/admin-real-stack-e2e exec playwright install --with-deps chromium

      - name: Verify real backend admin smoke
        run: pnpm test:e2e:real

      - name: Upload real-stack reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullnet-real-stack-e2e-reports
          path: |
            tests/e2e/admin-real-stack/playwright-report/**
            tests/e2e/admin-real-stack/test-results/**
          if-no-files-found: warn

  real-stack-e2e-mysql:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend for real-stack E2E
        run: dotnet build Full.NET.slnx --configuration Release

      - name: Install Playwright Chromium
        run: pnpm --filter @fullnet/admin-real-stack-e2e exec playwright install --with-deps chromium

      - name: Verify real backend admin smoke on MySQL
        run: pnpm test:e2e:real:mysql

      - name: Upload real-stack MySQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullnet-real-stack-e2e-mysql-reports
          path: |
            tests/e2e/admin-real-stack/playwright-report/**
            tests/e2e/admin-real-stack/test-results/**
          if-no-files-found: warn

  build-test:
    runs-on: ubuntu-latest
    # PR ????push main ????????�?90m??????�?--timeout�?
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore Full.NET.slnx

      - name: Audit packages
        run: dotnet list Full.NET.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build Full.NET.slnx --configuration Release --no-restore

      - name: Verify Integration shard discovery
        run: node scripts/testing/verify-integration-shards.mjs

      - name: Unit tests
        run: >-
          dotnet tests/Full.NET.UnitTests/bin/Release/net10.0/Full.NET.UnitTests.dll
          --no-ansi
          --progress off
          --minimum-expected-tests 510

      - name: Compatibility tests
        run: >-
          dotnet tests/Full.NET.CompatibilityTests/bin/Release/net10.0/Full.NET.CompatibilityTests.dll
          --no-ansi
          --progress off
          --minimum-expected-tests 7

      - name: Architecture tests
        run: >-
          dotnet tests/Full.NET.ArchitectureTests/bin/Release/net10.0/Full.NET.ArchitectureTests.dll
          --no-ansi
          --progress off
          --minimum-expected-tests 49

      # PR ?????? Identity/Tenancy/Outbox ??????????????�?push main�?
      - name: Integration smoke (dual-provider)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: node scripts/testing/run-integration-shard.mjs smoke

      # canonical 本地全量回退：
      # dotnet tests/Full.NET.IntegrationTests/bin/Release/net10.0/Full.NET.IntegrationTests.dll --minimum-expected-tests 199 --timeout 90m

      - name: Serialization baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          dotnet run
          --no-build
          --configuration Release
          --project benchmarks/Full.NET.Benchmarks/Full.NET.Benchmarks.csproj
          --
          --job short
          --filter "*SerializationBenchmarks*"

      - name: Upload test and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullnet-quality-reports
          path: |
            tests/Full.NET.IntegrationTests/bin/Release/net10.0/TestResults/**/*.trx
            BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn

  integration-shard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        shard: [api-sqlserver, api-mysql, migrations, infrastructure]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Full.NET.IntegrationTests/Full.NET.IntegrationTests.csproj

      - name: Build Integration tests
        run: >-
          dotnet build
          tests/Full.NET.IntegrationTests/Full.NET.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Run Integration shard
        run: node scripts/testing/run-integration-shard.mjs ${{ matrix.shard }}

      - name: Summarize Integration durations
        if: always()
        run: node scripts/testing/analyze-trx-durations.mjs

      - name: Upload Integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullnet-integration-${{ matrix.shard }}
          path: tests/Full.NET.IntegrationTests/bin/Release/net10.0/TestResults/**/*.trx
          if-no-files-found: warn

  integration-gate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, integration-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all Integration shards
        run: |
          test "${{ needs.build-test.result }}" = "success"
          test "${{ needs.integration-shard.result }}" = "success"
          echo "All 199 Integration tests passed across four isolated shards."
