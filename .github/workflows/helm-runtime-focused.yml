name: helm-runtime-focused

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 仅执行明确的部署工具场景
        required: true
        default: runtime-config
        type: choice
        options: [runtime-config, cdc-identities, cache-cluster-driver, infrastructure-backup, ubuntu-role-release, network-readiness, release-evidence, oci-packaging, object-restore, oci-runtime, cluster-network, cache-cluster-runtime, object-certificate, edge-reload-recovery, web-certificate-recovery, gateway-trust, gateway-configuration-admission, ubuntu-role-batch, metrics-platform, metrics-kubernetes]
      helm_version:
        description: Helm 场景使用的固定版本
        required: true
        default: v3.16.4
        type: choice
        options: [v3.16.4, v4.0.0]

permissions:
  contents: read

jobs:
  runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.scenario == 'oci-runtime' || inputs.scenario == 'cluster-network' || inputs.scenario == 'cache-cluster-runtime' || inputs.scenario == 'gateway-trust' || inputs.scenario == 'metrics-platform' || inputs.scenario == 'metrics-kubernetes') && 20 || 10 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate the selected deployment scope
        env:
          SCENARIO: ${{ inputs.scenario }}
          HELM_VERSION: ${{ inputs.helm_version }}
        run: |
          case "$SCENARIO" in runtime-config|cdc-identities|cache-cluster-driver|infrastructure-backup|ubuntu-role-release|network-readiness|release-evidence|oci-packaging|object-restore|oci-runtime|cluster-network|cache-cluster-runtime|object-certificate|edge-reload-recovery|web-certificate-recovery|gateway-trust|gateway-configuration-admission|ubuntu-role-batch|metrics-platform|metrics-kubernetes) ;; *) exit 64 ;; esac
          case "$HELM_VERSION" in v3.16.4|v4.0.0) ;; *) exit 64 ;; esac
      - uses: actions/setup-node@v4
        if: inputs.scenario == 'runtime-config' || inputs.scenario == 'cdc-identities'
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        if: inputs.scenario == 'cache-cluster-driver' || inputs.scenario == 'network-readiness' || inputs.scenario == 'release-evidence' || inputs.scenario == 'oci-packaging' || inputs.scenario == 'oci-runtime' || inputs.scenario == 'cluster-network' || inputs.scenario == 'cache-cluster-runtime' || inputs.scenario == 'object-certificate' || inputs.scenario == 'edge-reload-recovery' || inputs.scenario == 'web-certificate-recovery' || inputs.scenario == 'gateway-trust' || inputs.scenario == 'metrics-platform' || inputs.scenario == 'metrics-kubernetes'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: inputs.scenario == 'oci-runtime' || inputs.scenario == 'cache-cluster-runtime'
        with:
          dotnet-version: 10.0.x
      - uses: azure/setup-kubectl@v4
        if: inputs.scenario == 'cluster-network' || inputs.scenario == 'cache-cluster-runtime' || inputs.scenario == 'gateway-trust' || inputs.scenario == 'metrics-kubernetes'
        with:
          version: v1.34.0
      - name: Prepare the isolated Kubernetes runtime
        if: inputs.scenario == 'cluster-network' || inputs.scenario == 'cache-cluster-runtime' || inputs.scenario == 'gateway-trust' || inputs.scenario == 'metrics-kubernetes'
        run: |
          set -euo pipefail
          tool_directory="$RUNNER_TEMP/fullnet-kind-v0.30.0"
          mkdir -p "$tool_directory/bin"
          for artifact in kind-linux-amd64 kind-linux-amd64.sha256sum; do
            curl -4 -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 \
              "https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/$artifact" -o "$tool_directory/$artifact"
          done
          (cd "$tool_directory"; sha256sum -c kind-linux-amd64.sha256sum)
          install -m 0755 "$tool_directory/kind-linux-amd64" "$tool_directory/bin/kind"
          echo "$tool_directory/bin" >> "$GITHUB_PATH"
          "$tool_directory/bin/kind" version
          kubectl version --client=true --output=json
          docker --version
      - name: Prepare the real OCI transport
        if: inputs.scenario == 'oci-runtime'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
          docker --version
          dotnet --version
      - uses: azure/setup-helm@v4
        if: inputs.scenario == 'runtime-config' || inputs.scenario == 'cdc-identities' || inputs.scenario == 'ubuntu-role-release' || inputs.scenario == 'ubuntu-role-batch' || inputs.scenario == 'metrics-platform' || inputs.scenario == 'metrics-kubernetes'
        with:
          version: ${{ inputs.helm_version }}
      - name: Verify only the selected deployment scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
          HELM_VERSION: ${{ inputs.helm_version }}
        run: |
          set -euo pipefail
          before="$(git status --porcelain --untracked-files=all)"
          case "$SCENARIO" in
            ubuntu-role-release|ubuntu-role-batch)
              helm version --short
              helm_binary="$(command -v helm)"
              docker pull python:3.12-slim-bookworm
              docker image inspect python:3.12-slim-bookworm --format '{{.Id}}'
              docker run --rm -i --network none --cpus 1 --memory 256m --pids-limit 128 \
                --mount "type=bind,source=$PWD,target=/workspace,readonly" \
                --mount "type=bind,source=$helm_binary,target=/tools/helm,readonly" -w /workspace \
                -e FULLNET_RELEASE_TEST_CONTAINER=isolated -e FULLNET_TEST_REAL_HELM=/tools/helm \
                -e "FULLNET_TEST_HELM_VERSION=$HELM_VERSION" -e "FULLNET_TEST_RELEASE_MODE=$SCENARIO" -e PYTHONDONTWRITEBYTECODE=1 \
                python:3.12-slim-bookworm python3 -O - <<'PY'
          import os, sys, unittest
          sys.path.insert(0, 'tests/deployment')
          import ubuntu_role_release_test as fixture
          batch = os.environ['FULLNET_TEST_RELEASE_MODE'] == 'ubuntu-role-batch'
          real_method = 'test_batch_actual_chart_renders_each_role_once_with_one_package' if batch else 'test_actual_chart_renders_exactly_the_selected_role_despite_all_roles_in_values'
          real = unittest.TestSuite([fixture.RealHelmRolePlanTests(real_method)])
          if os.environ['FULLNET_TEST_HELM_VERSION'] == 'v4.0.0':
              suite, expected = real, 1
          else:
              suite = unittest.TestSuite([unittest.defaultTestLoader.loadTestsFromTestCase(fixture.ReleaseControlTests), real])
              expected = 19
              if batch:
                  import ubuntu_batch_release_test as batches
                  suite.addTests(unittest.defaultTestLoader.loadTestsFromTestCase(batches.BatchReleaseTests))
                  suite.addTest(fixture.RealHelmRolePlanTests('test_actual_chart_renders_exactly_the_selected_role_despite_all_roles_in_values'))
                  expected = 35
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != expected:
              raise SystemExit(1)
          print(f'ubuntu_role_release: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            object-restore)
              docker pull python:3.12-slim-bookworm
              docker image inspect python:3.12-slim-bookworm --format '{{.Id}}'
              docker run --rm -i --network none --cpus 1 --memory 256m --pids-limit 128 \
                --mount "type=bind,source=$PWD,target=/workspace,readonly" -w /workspace \
                -e FULLNET_OBJECT_RESTORE_TEST_CONTAINER=isolated -e PYTHONDONTWRITEBYTECODE=1 \
                python:3.12-slim-bookworm python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='object_restore_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 28:
              raise SystemExit(1)
          print(f'object_restore: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            infrastructure-backup)
              docker pull python:3.12-slim-bookworm
              docker image inspect python:3.12-slim-bookworm --format '{{.Id}}'
              docker run --rm -i --network none --cpus 1 --memory 256m --pids-limit 128 \
                --mount "type=bind,source=$PWD,target=/workspace,readonly" -w /workspace \
                -e FULLNET_BACKUP_TEST_CONTAINER=isolated -e PYTHONDONTWRITEBYTECODE=1 \
                python:3.12-slim-bookworm python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='infrastructure_backup_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 28:
              raise SystemExit(1)
          print(f'infrastructure_backup: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            runtime-config)
              helm version --short
              node --test tests/deployment/helm-runtime-config.test.mjs ;;
            cdc-identities)
              helm version --short
              node --test --test-reporter=tap --test-name-pattern='^CDC multi-stream retention mappings render independent IDs and reject ambiguous or unbounded identities$' tests/deployment/helm-contract.test.mjs | tee "$RUNNER_TEMP/cdc-focused.log"
              CDC_LOG="$RUNNER_TEMP/cdc-focused.log" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const log = fs.readFileSync(process.env.CDC_LOG, 'utf8');
          for (const [name, value] of Object.entries({tests: 1, pass: 1, fail: 0, cancelled: 0, skipped: 0}))
            assert.match(log, new RegExp('^# ' + name + '\\s+' + value + '$', 'm'));
          NODE
              ;;
            cache-cluster-driver)
              python3 --version
              python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='cache_cluster_verifier_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 15:
              raise SystemExit(1)
          print(f'cache_cluster_driver: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            network-readiness)
              python3 --version
              openssl version
              python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='network_readiness_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 23:
              raise SystemExit(1)
          print(f'network_readiness: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            release-evidence)
              python3 --version
              python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='release_evidence_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 33:
              raise SystemExit(1)
          print(f'release_evidence: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            oci-packaging)
              python3 --version
              python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='oci_packaging_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 31:
              raise SystemExit(1)
          print(f'oci_packaging: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            oci-runtime)
              FULLNET_OCI_RUNTIME=isolated python3 -O - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests/deployment')
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='oci_runtime_test.py')
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('oci_packaging_test.OciPackagingTests.test_cli_failure_classes_are_redacted'))
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('oci_packaging_test.OciPackagingTests.test_online_index_and_downloads_verify_declared_digests'))
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('oci_packaging_test.OciPackagingTests.test_transport_budget_never_weakens_exact_descriptor_size'))
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName('oci_packaging_test.OciPackagingTests.test_docker_base_layers_use_oci_types_without_rewriting_content'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 7:
              raise SystemExit(1)
          print(f'oci_runtime: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            cluster-network)
              FULLNET_CLUSTER_REAL=isolated python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='cluster_network_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 18:
              raise SystemExit(1)
          print(f'cluster_network: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            cache-cluster-runtime)
              FULLNET_CACHE_CLUSTER=isolated python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='cache_cluster_runtime_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 2:
              raise SystemExit(1)
          print(f'cache_cluster_runtime: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            object-certificate)
              python3 --version
              openssl version
              curl --version
              python3 -O - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='object_certificate_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 22:
              raise SystemExit(1)
          print(f'object_certificate: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            edge-reload-recovery)
              tool_directory=$(mktemp -d "$RUNNER_TEMP/fullnet-nginx-XXXXXX")
              trap 'rm -rf -- "$tool_directory"' EXIT
              mkdir "$tool_directory/download"
              sudo apt-get update -qq
              (cd "$tool_directory/download" && apt-get download nginx)
              for package in "$tool_directory"/download/*.deb; do
                dpkg-deb -x "$package" "$tool_directory/runtime"
              done
              export PATH="$tool_directory/runtime/usr/sbin:$PATH"
              nginx -v
              sha256sum "$tool_directory/runtime/usr/sbin/nginx"
              python3 -O - <<'PY'
          import unittest
          suite = unittest.TestSuite()
          for pattern in ('test_edge_ready_upstreams.py', 'edge_reload_runtime_test.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests/deployment', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 13:
              raise SystemExit(1)
          print(f'edge_reload_recovery: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            web-certificate-recovery)
              tool_directory=$(mktemp -d "$RUNNER_TEMP/fullnet-web-nginx-XXXXXX")
              trap 'rm -rf -- "$tool_directory"' EXIT
              mkdir "$tool_directory/download"
              sudo apt-get update -qq
              (cd "$tool_directory/download" && apt-get download nginx)
              for package in "$tool_directory"/download/*.deb; do
                dpkg-deb -x "$package" "$tool_directory/runtime"
              done
              export PATH="$tool_directory/runtime/usr/sbin:$PATH"
              python3 --version
              openssl version
              nginx -v
              sha256sum "$tool_directory/runtime/usr/sbin/nginx"
              python3 -O - <<'PY'
          import unittest
          suite = unittest.TestSuite()
          for pattern in ('test_application_crl.py', 'web_certificate_runtime_test.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests/deployment', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 12:
              raise SystemExit(1)
          print(f'web_certificate_recovery: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            gateway-trust)
              python3 -O - <<'PY'
          import unittest
          suite = unittest.TestSuite()
          for pattern in ('gateway_trust_test.py', 'gateway_trust_runtime_test.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests/deployment', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 20:
              raise SystemExit(1)
          print(f'gateway_trust: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            gateway-configuration-admission)
              docker run --rm -i --network none --cpus 1 --memory 128m --pids-limit 64 \
                -e PYTHONDONTWRITEBYTECODE=1 --mount "type=bind,source=$PWD,target=/repository,readonly" \
                -w /repository python:3.12-alpine python3 -O - <<'PY'
          import sys
          import unittest
          print(sys.version)
          suite = unittest.defaultTestLoader.discover('tests/deployment', pattern='gateway_configuration_admission_test.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 20:
              raise SystemExit(1)
          print(f'gateway_configuration_admission: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            metrics-kubernetes)
              export FULLNET_METRICS_KUBERNETES=isolated
              export FULLNET_TEST_REAL_HELM="$(command -v helm)"
              python3 -O - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests/deployment')
          suite = unittest.defaultTestLoader.loadTestsFromName(
              'metrics_platform_kubernetes_test.MetricsPlatformKubernetesTests.test_original_manifests_watch_deployments_and_preserve_both_pvc_states_after_pod_replacement')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or not result.testsRun:
              raise SystemExit(1)
          print(f'metrics_kubernetes: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            metrics-platform)
              export FULLNET_METRICS_REAL=isolated
              export FULLNET_TEST_REAL_HELM="$(command -v helm)"
              python3 -O - <<'PY'
          import unittest
          suite = unittest.TestSuite()
          for pattern in ('metrics_platform_test.py', 'metrics_platform_runtime_test.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests/deployment', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 14:
              raise SystemExit(1)
          print(f'metrics_platform: passed={result.testsRun} failed=0 skipped=0')
          PY
              ;;
            *) exit 64 ;;
          esac
          test "$before" = "$(git status --porcelain --untracked-files=all)"
