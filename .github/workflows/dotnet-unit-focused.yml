name: dotnet-unit-focused

on:
  workflow_dispatch:
    inputs:
      test_class:
        description: 完整测试类名，仅执行该类，禁止命名空间或通配符
        required: true
        type: string
      test_method:
        description: 可选精确方法名；留空执行该类
        required: false
        type: string
      minimum_expected_tests:
        description: 此次聚焦范围的最低发现数
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 提前拒绝不存在的类及筛选表达式，再由既有入口构建和执行聚焦范围。
      - name: Validate focused test identity
        env:
          TARGET_CLASS: ${{ inputs.test_class }}
          TARGET_METHOD: ${{ inputs.test_method }}
          MINIMUM_TESTS: ${{ inputs.minimum_expected_tests }}
        run: node scripts/testing/run-focused-unit.mjs --validate

      # SDK 隐式引入的链接器版本也受锁文件约束；先还原再冻结，不接受编译期间改写输入。
      - name: Restore Unit inputs
        run: |
          dotnet --version
          dotnet restore tests/Full.NET.UnitTests/Full.NET.UnitTests.csproj --force-evaluate

      - name: Verify restored tool lockfiles
        id: locks
        run: git diff --quiet -- src/Tools/Full.NET.Ai.DocxParser/packages.lock.json src/Tools/Full.NET.Ai.PdfParser/packages.lock.json

      - name: Preserve regenerated tool lockfiles
        if: failure() && steps.locks.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: restored-parser-lockfiles
          if-no-files-found: error
          retention-days: 1
          path: |
            src/Tools/Full.NET.Ai.DocxParser/packages.lock.json
            src/Tools/Full.NET.Ai.PdfParser/packages.lock.json

      - name: Run focused Unit tests
        env:
          TARGET_CLASS: ${{ inputs.test_class }}
          TARGET_METHOD: ${{ inputs.test_method }}
          MINIMUM_TESTS: ${{ inputs.minimum_expected_tests }}
        run: node scripts/testing/run-focused-unit.mjs

      - name: Diagnose failed focused inputs
        if: failure()
        # 仅保留路径与状态，禁止输出源码差异、环境变量或秘密值。
        run: git status --short --untracked-files=all
